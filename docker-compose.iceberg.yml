# Overlay adding the Iceberg REST catalog to the base stack (same pattern as the
# Keycloak overlays — stack it with -f):
#
#   docker compose -f docker-compose.yml -f docker-compose.iceberg.yml up --build
#   (or: make run-iceberg / make up-iceberg-d)
#
# Adds a MinIO warehouse (console on :9001, credentials minioadmin/minioadmin), a
# one-shot bucket initializer, and the metacatalog-iceberg-catalog application on
# :8181, sharing the base stack's postgres. Point Spark / Trino / PyIceberg at
# http://localhost:8181; data and metadata files land in s3://iceberg-warehouse.

services:
  minio:
    image: minio/minio:latest
    container_name: metacatalog-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the Iceberg warehouse bucket (idempotent across restarts).
  minio-init:
    image: minio/mc:latest
    container_name: metacatalog-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/iceberg-warehouse
      "
    restart: "no"

  iceberg-catalog:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: metacatalog-iceberg-catalog
    image: metacatalog-iceberg-catalog:0.0.1-SNAPSHOT
    container_name: metacatalog-iceberg-catalog
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/metacatalog
      SPRING_DATASOURCE_USERNAME: metacatalog
      SPRING_DATASOURCE_PASSWORD: metacatalog
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8181/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  minio-data:
