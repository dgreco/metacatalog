# Overlay adding the Iceberg REST catalog to the base stack (same pattern as the
# Keycloak overlays — stack it with -f):
#
#   docker compose -f docker-compose.yml -f docker-compose.iceberg.yml up --build
#   (or: make run-iceberg / make up-iceberg-d)
#
# Adds a SeaweedFS S3 warehouse (S3 API on :8333, credentials
# seaweedadmin/seaweedadmin from docker/seaweedfs/s3.json), a one-shot bucket
# initializer, and the metacatalog-iceberg-catalog application on :8181, sharing
# the base stack's postgres. Point Spark / Trino / PyIceberg at
# http://localhost:8181; data and metadata files land in s3://iceberg-warehouse.

services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: metacatalog-seaweedfs
    # One process for the whole stack (master + volume + filer + S3 gateway) —
    # plenty for a single-node warehouse.
    command: server -dir=/data -master.volumeSizeLimitMB=1024 -filer -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # The filer answers once master + volume + filer are all up; the S3 gateway
      # sits directly on the filer, so this is the readiness signal that matters.
      # SeaweedFS binds to the container IP, not localhost — probe via hostname -i.
      test: ["CMD-SHELL", "wget -qO- http://$(hostname -i):8888/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: create the Iceberg warehouse bucket (idempotent across restarts).
  seaweedfs-init:
    image: chrislusf/seaweedfs:latest
    container_name: metacatalog-seaweedfs-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 's3.bucket.create -name iceberg-warehouse' | weed shell -master=seaweedfs:9333 || true
      "
    restart: "no"

  iceberg-catalog:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: metacatalog-iceberg-catalog
    image: metacatalog-iceberg-catalog:0.0.1-SNAPSHOT
    container_name: metacatalog-iceberg-catalog
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/metacatalog
      SPRING_DATASOURCE_USERNAME: metacatalog
      SPRING_DATASOURCE_PASSWORD: metacatalog
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8181/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  bulk-loader:
    # The Iceberg stack has no use for the demo model — the catalog declares its own
    # immutable model at startup — so keep the loader out, same trick as the Keycloak
    # overlay: assign it to a profile nothing activates. To seed the demo data anyway,
    # run the base compose file once first; the postgres volume is shared.
    profiles: ["demo-data-only"]

volumes:
  seaweedfs-data:
