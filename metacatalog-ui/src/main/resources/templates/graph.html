<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Catalog Graph — Meta Catalog</title>
    <link rel="stylesheet" th:href="@{/ui/css/app.css}"/>
    <script th:src="@{/ui/js/theme.js}"></script>
</head>
<body>
<header class="topbar">
    <h1>Catalog Graph</h1>
    <nav><a class="btn" th:href="@{/ui}">← Back</a></nav>
    <form method="post" th:action="@{/logout}" class="logout-form" th:if="${authenticated}">
        <span class="user" th:text="${username}">user</span>
        <button type="submit" class="btn">Logout</button>
    </form>
</header>

<main>
    <div class="graph-toolbar">
        <div class="graph-legend">
            <span class="lg lg-node lg-type">Entity type</span>
            <span class="lg lg-node lg-trait">Trait</span>
            <span class="lg lg-node lg-entity">Entity</span>
            <span class="lg lg-edge lg-extends">extends</span>
            <span class="lg lg-edge lg-has-trait">trait</span>
            <span class="lg lg-edge lg-instance-of">instance-of</span>
            <span class="lg lg-edge lg-rel">relationship</span>
            <span class="lg lg-edge lg-mapping">MAPPED_TO</span>
        </div>
        <div class="graph-actions">
            <button class="btn" id="graph-relayout" type="button" title="Recompute the layout to minimise overlaps">↻ Re-layout</button>
            <label class="graph-toggle" title="Show the inverse of each relationship (IS_REQUIRED_BY, IS_PART_OF, IS_MAPPED_BY)">
                <input type="checkbox" id="graph-show-inverses" th:checked="${showInverses}"/> Show inverses
            </label>
            <label class="graph-toggle" title="Show entity instances and their relationships alongside the type layer">
                <input type="checkbox" id="graph-show-entities" th:checked="${showEntities}"/> Show entities
            </label>
            <span class="graph-hint">Drag nodes to rearrange · drag the background to pan · scroll to zoom</span>
        </div>
    </div>
    <div id="graph-canvas" class="graph-canvas">
        <p class="empty graph-empty" id="graph-empty" hidden>Nothing has been created yet.</p>
    </div>
</main>

<script type="application/json" id="graph-data" th:utext="${graphJson}">{"nodes":[],"edges":[]}</script>
<script th:src="@{/ui/js/schema-view.js}"></script>
<script th:src="@{/ui/js/graph.js}"></script>
</body>
</html>
