<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Instances — Meta Catalog</title>
    <link rel="stylesheet" th:href="@{/ui/css/app.css}"/>
    <script th:src="@{/ui/js/theme.js}"></script>
</head>
<body>
<header class="topbar">
    <h1>Instances</h1>
    <nav>
        <a class="btn" th:href="@{/ui}">Back</a>
        <a class="btn" th:href="@{/ui/instances/new}">+ New</a>
    </nav>
</header>

<main>
    <div class="flash" th:if="${message}" th:text="${message}"></div>
    <div class="error" th:if="${error}" th:text="${error}"></div>

    <!-- Filter -->
    <div class="filter-bar">
        <form method="get" th:action="@{/ui/instances}">
            <label for="type">Filter by type:</label>
            <select name="type" id="type" onchange="this.form.submit()">
                <option value="">All types</option>
                <option th:each="et : ${entityTypes}"
                        th:value="${et.name}"
                        th:text="${et.name}"
                        th:selected="${selectedType != null && selectedType == et.name}">type</option>
            </select>
        </form>
    </div>

    <!-- Instances table -->
    <table th:if="${!instances.isEmpty()}">
        <thead>
        <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Version</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="inst : ${instances}">
            <td>
                <a th:href="@{/ui/instances/{id}(id=${inst.id})}"
                   th:text="${inst.name}">name</a>
            </td>
            <td>
                <span class="tag" th:text="${inst.entityType}">entityType</span>
            </td>
            <td>
                <span class="tag muted" th:text="${inst.entityTypeVersionId}">version</span>
            </td>
            <td>
                <a class="btn-sm" th:href="@{/ui/instances/{id}(id=${inst.id})}" title="View">View</a>
                <a class="btn-sm" th:href="@{/ui/instances/{id}/edit(id=${inst.id})}" title="Edit">Edit</a>
                <form method="post" th:action="@{/ui/instances/{id}/delete(id=${inst.id})}"
                      class="inline-form" data-confirm="Delete this instance?">
                    <button type="submit" class="link-remove" title="Delete">×</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${instances.isEmpty()}">No instances yet.</p>
</main>

<script>
    document.querySelectorAll('form[data-confirm]').forEach(function (form) {
        form.addEventListener('submit', function (e) {
            if (!window.confirm(form.getAttribute('data-confirm'))) {
                e.preventDefault();
            }
        });
    });
</script>
</body>
</html>
