<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Aggregate Instances — Meta Catalog</title>
    <link rel="stylesheet" th:href="@{/ui/css/app.css}"/>
    <script th:src="@{/ui/js/theme.js}"></script>
</head>
<body>
<header class="topbar">
    <h1>Aggregate Instances</h1>
    <nav>
        <a class="btn" th:href="@{/ui}">Back</a>
        <a class="btn" th:href="@{/ui/instances/entities}">Entities</a>
        <a class="btn" th:href="@{/ui/instances/aggregates/new}">+ New Aggregate</a>
    </nav>
</header>

<main>
    <div class="flash" th:if="${message}" th:text="${message}"></div>
    <div class="error" th:if="${error}" th:text="${error}"></div>

    <!-- Aggregate instances table -->
    <table th:if="${!aggregates.isEmpty()}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Type</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="agg : ${aggregates}">
            <td>
                <a th:href="@{/ui/instances/aggregates/{id}(id=${agg.id})}"
                   th:text="${agg.id}">id</a>
            </td>
            <td>
                <span class="tag" th:text="${agg.entityType}">entityType</span>
            </td>
            <td>
                <a class="btn-sm" th:href="@{/ui/instances/aggregates/{id}(id=${agg.id})}" title="View">View</a>
                <form method="post" th:action="@{/ui/instances/aggregates/{id}/delete(id=${agg.id})}"
                      class="inline-form" data-confirm="Delete this aggregate?">
                    <button type="submit" class="link-remove" title="Delete">×</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="empty" th:if="${aggregates.isEmpty()}">No aggregate instances yet.</p>
</main>

<script>
    document.querySelectorAll('form[data-confirm]').forEach(function (form) {
        form.addEventListener('submit', function (e) {
            if (!window.confirm(form.getAttribute('data-confirm'))) {
                e.preventDefault();
            }
        });
    });
</script>
</body>
</html>
