<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>New Entity Type — Meta Catalog</title>
    <link rel="stylesheet" th:href="@{/ui/css/app.css}"/>
    <script th:src="@{/ui/js/theme.js}"></script>
</head>
<body>
<header class="topbar">
    <h1>New Entity Type</h1>
    <nav><a class="btn" th:href="@{/ui}">← Back</a></nav>
    <form method="post" th:action="@{/logout}" class="logout-form" th:if="${authenticated}">
        <span class="user" th:text="${username}">user</span>
        <button type="submit" class="btn">Logout</button>
    </form>
</header>

<main>
    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form method="post" th:action="@{/ui/entity-types}" th:object="${entityTypeForm}" id="type-form">
        <label>
            Name
            <input type="text" th:field="*{name}" required autofocus/>
        </label>

        <label>
            Father (optional)
            <select th:field="*{father}">
                <option value="">— none —</option>
                <option th:each="et : ${entityTypes}"
                        th:value="${et.name}"
                        th:text="${et.name}">entity type</option>
            </select>
        </label>

        <label>
            Traits (optional — Ctrl/Cmd-click to select several)
            <select th:field="*{traits}" class="traits-select" multiple size="6"
                    th:disabled="${traits.isEmpty()}">
                <option th:each="trait : ${traits}"
                        th:value="${trait.name}"
                        th:text="${trait.name}">trait</option>
            </select>
            <span class="empty" th:if="${traits.isEmpty()}">No traits defined yet.</span>
        </label>

        <fieldset id="schema-builder" th:attr="data-initial-schema=*{schema}">
            <legend>Schema</legend>

            <div class="tabs">
                <button type="button" class="tab active" data-tab="builder">Builder</button>
                <button type="button" class="tab" data-tab="raw">Raw JSON</button>
            </div>

            <div class="tab-panel" data-panel="builder">
                <div id="prop-root" class="prop-list"></div>
                <button type="button" id="add-prop" class="btn">+ Add property</button>
            </div>

            <div class="tab-panel hidden" data-panel="raw">
                <textarea id="raw-schema" class="raw-schema" rows="16" spellcheck="false"></textarea>
            </div>

            <div id="schema-validation" class="validation"></div>

            <details class="preview-wrap">
                <summary>Generated JSON schema</summary>
                <pre id="schema-preview">{}</pre>
            </details>
        </fieldset>

        <input type="hidden" th:field="*{schema}" id="schema-input"/>

        <div class="actions">
            <button type="submit" class="btn primary">Create entity type</button>
            <a class="btn" th:href="@{/ui}">Cancel</a>
        </div>
    </form>
</main>

<script th:src="@{/ui/js/schema-builder.js}"></script>
</body>
</html>
