<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>New Aggregate — Meta Catalog</title>
    <link rel="stylesheet" th:href="@{/ui/css/app.css}"/>
    <script th:src="@{/ui/js/theme.js}"></script>
</head>
<body>
<header class="topbar">
    <h1>New Aggregate</h1>
    <nav>
        <a class="btn" th:href="@{/ui/instances/aggregates}">Back</a>
    </nav>
</header>

<main>
    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form method="post" th:action="@{/ui/instances/aggregates}" th:object="${aggregateForm}">
        <!-- YAML input -->
        <div class="form-group">
            <label for="yaml">Aggregate YAML</label>
            <textarea id="yaml" name="yaml" th:field="*{yaml}"
                      rows="20" required
                      placeholder='entityType: MyAggregate&#10;values:&#10;  name: "My Aggregate"'
                      style="font-family: monospace; font-size: 0.9em; width: 100%;"></textarea>
            <small class="hint">YAML defining the aggregate root entity and its nested elements.</small>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn">Create</button>
            <a class="btn" th:href="@{/ui/instances/aggregates}" th:text="Cancel">Cancel</a>
        </div>
    </form>
</main>

</body>
</html>
