openapi: "3.1.0"
info:
  version: 1.0.0
  title: Meta Catalog Manager API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://metacatalog.fairytales.local
tags:
  - name: Meta Catalog Manager
paths:
  /metacatalog/v1/bulk-creation:
    post:
      tags:
        - Meta Catalog Manager
      summary: Bulk creation of traits, entity types and entities
      operationId: bulkCreation
      requestBody:
        description: A YAML file containing one or more YAML documents
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        204:
          description: Bulk creation successful
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/trait:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get all traits
      operationId: listTraits
      responses:
        200:
          description: If successful, return a list of Trait objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trait'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    post:
      tags:
        - Meta Catalog Manager
      summary: Create a user-defined trait
      operationId: createTrait
      requestBody:
        description: A Trait spec
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Trait'
        required: true
      responses:
        204:
          description: Trait created
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/trait/{name}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get a trait by name
      operationId: getTrait
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
            description: Trait name
      responses:
        200:
          description: If successful, return a Trait object
          content:
             application/json:
               schema:
                 $ref: '#/components/schemas/Trait'
        400:
            description: Invalid input
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ValidationError'
        404:
          description: Trait not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
           description: System problem
           content:
             application/json:
               schema:
                  $ref: '#/components/schemas/SystemError'
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete a trait by name
      operationId: deleteTrait
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
            description: Trait name
      responses:
        204:
          description: Trait deleted
        400:
            description: Invalid input
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ValidationError'
        404:
          description: Trait not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
           description: System problem
           content:
             application/json:
               schema:
                  $ref: '#/components/schemas/SystemError'
    head:
      tags:
        - Meta Catalog Manager
      summary: Check if a trait exists by name
      operationId: existsTrait
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
            description: Trait name
      responses:
        200:
          description: Trait exists
        404:
          description: Trait does not exist
        400:
            description: Invalid input
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ValidationError'
        500:
           description: System problem
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/trait/{name}/versions:
    get:
      tags:
        - Meta Catalog Manager
      summary: List all versions of a trait
      operationId: listTraitVersions
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
            description: Trait name
      responses:
        200:
          description: If successful, return a list of Trait objects (oldest version first, live version last)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trait'
        400:
            description: Invalid input
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ValidationError'
        404:
          description: Trait not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
            description: System problem
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/SystemError'
    post:
      tags:
        - Meta Catalog Manager
      summary: Create a new version of a trait
      description: >
        Snapshots the current live trait into the history table and mutates the live row with the
        new schema and father. The version number is auto-generated as a progressive integer.
      operationId: createTraitVersion
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
            description: Trait name
      requestBody:
        description: The new Trait spec for the new version
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Trait'
        required: true
      responses:
        200:
          description: If successful, return the new current (live) Trait
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trait'
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/trait/{name}/versions/{version}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get a specific version of a trait
      operationId: getTraitVersion
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
            description: Trait name
        - in: path
          name: version
          required: true
          schema:
            type: integer
            description: Version number
      responses:
        200:
          description: If successful, return a Trait object frozen at the requested version
          content:
             application/json:
               schema:
                 $ref: '#/components/schemas/Trait'
        400:
            description: Invalid input
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ValidationError'
        404:
          description: Trait or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
           description: System problem
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/SystemError'
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete a specific historical version of a trait
      description: >
        Deletes the version snapshot and relinks the version chain. The current (live) version
        cannot be deleted through this endpoint.
      operationId: deleteTraitVersion
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
            description: Trait name
        - in: path
          name: version
          required: true
          schema:
            type: integer
            description: Version number
      responses:
        204:
          description: Version deleted
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Trait not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
           description: System problem
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/trait/link:
    post:
      tags:
        - Meta Catalog Manager
      summary: Create a link between two traits by a relation
      operationId: linkTrait
      requestBody:
        description: A Link Trait spec
        content:
          application/json:
            schema:
              required:
                - sourceTrait
                - relationshipTypeName
                - targetTrait
              type: object
              properties:
                sourceTrait:
                  type: string
                relationshipTypeName:
                  type: string
                targetTrait:
                  type: string
        required: true
      responses:
        204:
          description: Trait link created
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Source or target trait not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/trait/link/{sourceTrait}/{relationshipTypeName}/{targetTrait}:
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete a link between two traits by a relation
      operationId: unlinkTrait
      parameters:
        - in: path
          name: sourceTrait
          required: true
          schema:
            type: string
            description: Source Trait name
        - in: path
          name: relationshipTypeName
          required: true
          schema:
            type: string
            description: A relationship type name
        - in: path
          name: targetTrait
          required: true
          schema:
            type: string
            description: Target Trait name
      responses:
        204:
          description: Link deleted
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Source or target trait not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    head:
      tags:
        - Meta Catalog Manager
      summary: Check if a link exists between two traits by a relation
      operationId: existsLinkTrait
      parameters:
        - in: path
          name: sourceTrait
          required: true
          schema:
            type: string
            description: Source Trait name
        - in: path
          name: relationshipTypeName
          required: true
          schema:
            type: string
            description: A relationship type name
        - in: path
          name: targetTrait
          required: true
          schema:
            type: string
            description: Target Trait name
      responses:
        200:
          description: Link exists
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/trait/link/{sourceTrait}/{relationshipTypeName}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get the traits linked to a trait by a relation
      operationId: linkedTrait
      parameters:
        - in: path
          name: sourceTrait
          required: true
          schema:
            type: string
            description: Source Trait name
        - in: path
          name: relationshipTypeName
          required: true
          schema:
            type: string
            description: Relationship Type Name
      responses:
        200:
          description: If successful, return a list of linked traits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trait'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Source trait not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity-type:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get all entity types
      operationId: listEntityTypes
      responses:
        200:
          description: If successful, return a list of EntityType objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityType'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    post:
      tags:
        - Meta Catalog Manager
      summary: Create a user-defined type
      operationId: createEntityType
      requestBody:
        description: An EntityType spec
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityType'
        required: true
      responses:
        204:
          description: EntityType created
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity-type/{name}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get a user-defined type by name
      operationId: getEntityType
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
            description: EntityType name
      responses:
        200:
          description: If successful, return an EntityType object
          content:
             application/json:
               schema:
                 $ref: '#/components/schemas/EntityType'
        400:
            description: Invalid input
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ValidationError'
        404:
          description: EntityType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
           description: System problem
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/SystemError'
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete a user-defined type by name
      operationId: deleteEntityType
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
            description: EntityType name
      responses:
        204:
          description: Type deleted
        400:
            description: Invalid input
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ValidationError'
        404:
          description: EntityType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
           description: System problem
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/SystemError'
    head:
      tags:
        - Meta Catalog Manager
      summary: Check if a user-defined type exists by name
      operationId: existsEntityType
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
            description: EntityType name
      responses:
        200:
          description: EntityType exists
        404:
          description: EntityType does not exist
        400:
            description: Invalid input
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ValidationError'
        500:
           description: System problem
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity-type/{name}/versions:
    get:
      tags:
        - Meta Catalog Manager
      summary: List all versions of an entity type
      operationId: listEntityTypeVersions
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
            description: EntityType name
      responses:
        200:
          description: If successful, return a list of EntityType objects (oldest version first, live version last)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityType'
        400:
            description: Invalid input
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ValidationError'
        404:
          description: EntityType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
            description: System problem
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/SystemError'
    post:
      tags:
        - Meta Catalog Manager
      summary: Create a new version of an entity type
      description: >
        Snapshots the current live entity type into the history table and mutates the live row with
        the new schema, traits, and father. The version number is auto-generated as a progressive
        integer.
      operationId: createEntityTypeVersion
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
            description: EntityType name
      requestBody:
        description: The new EntityType spec for the new version
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityType'
        required: true
      responses:
        200:
          description: If successful, return the new current (live) EntityType
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityType'
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity-type/{name}/versions/{version}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get a specific version of an entity type
      operationId: getEntityTypeVersion
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
            description: EntityType name
        - in: path
          name: version
          required: true
          schema:
            type: integer
            description: Version number
      responses:
        200:
          description: If successful, return an EntityType object frozen at the requested version
          content:
             application/json:
               schema:
                 $ref: '#/components/schemas/EntityType'
        400:
            description: Invalid input
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ValidationError'
        404:
          description: EntityType or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
           description: System problem
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/SystemError'
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete a specific historical version of an entity type
      description: >
        Deletes the version snapshot and relinks the version chain. The current (live) version
        cannot be deleted through this endpoint.
      operationId: deleteEntityTypeVersion
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
            description: EntityType name
        - in: path
          name: version
          required: true
          schema:
            type: integer
            description: Version number
      responses:
        204:
          description: Version deleted
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: EntityType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
           description: System problem
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/mapping:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get all mappings
      operationId: listMappings
      responses:
        200:
          description: If successful, return a list of Mapping objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Mapping'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    post:
      tags:
        - Meta Catalog Manager
      summary: Create a mapping
      operationId: createMapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mapping'
      responses:
        204:
          description: Mapping created
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Source or target EntityType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/mapping/{id}:
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete a mapping by id
      operationId: deleteMapping
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            description: Mapping id
      responses:
        204:
          description: Mapping deleted
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity:
    post:
      tags:
        - Meta Catalog Manager
      summary: Create an entity
      operationId: createEntity
      requestBody:
        description: An Entity spec
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Entity'
        required: true
      responses:
        200:
          description: If successful, return an entity id
          content:
             application/text:
                schema:
                  type: string
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    get:
      tags:
        - Meta Catalog Manager
      summary: Get a list of entities
      operationId: getEntities
      parameters:
        - in: query
          name: entityTypeName
          required: true
          schema:
            type: string
            description: EntityType name
        - in: query
          name: queryPath
          required: true
          schema:
            type: string
            description: Query path expression
      responses:
        200:
          description: If successful, return a list of entities
          content:
             application/json:
               schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/Entity'
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: EntityType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity/{id}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get an entity by id
      operationId: getEntity
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            description: Entity Id
      responses:
        200:
          description: If successful, return an Entity object
          content:
             application/json:
               schema:
                 $ref: '#/components/schemas/Entity'
        400:
            description: Invalid input
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ValidationError'
        404:
          description: Entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
           description: System problem
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/SystemError'
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete an entity by id
      operationId: deleteEntity
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            description: Entity Id
      responses:
        204:
          description: Type deleted
        400:
            description: Invalid input
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ValidationError'
        404:
          description: Entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
           description: System problem
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/SystemError'
    head:
      tags:
        - Meta Catalog Manager
      summary: Check if an entity exists by id
      operationId: existsEntity
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            description: Entity id
      responses:
        200:
          description: Entity exists
        404:
          description: Entity does not exist
        400:
            description: Invalid input
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ValidationError'
        500:
           description: System problem
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity/link:
    post:
      tags:
        - Meta Catalog Manager
      summary: Create a link between two entities by a relation
      operationId: linkEntity
      requestBody:
        description: A Link Entity spec
        content:
          application/json:
            schema:
              required:
                - sourceEntityId
                - relationshipTypeName
                - targetEntityId
              type: object
              properties:
                sourceEntityId:
                  type: string
                relationshipTypeName:
                  type: string
                targetEntityId:
                  type: string
        required: true
      responses:
        204:
          description: Trait link created
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Source or target entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity/link/{sourceEntityId}/{relationshipTypeName}/{targetEntityId}:
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete a link between two entities by a relation
      operationId: unlinkEntity
      parameters:
        - in: path
          name: sourceEntityId
          required: true
          schema:
            type: string
            description: Source Entity Id
        - in: path
          name: relationshipTypeName
          required: true
          schema:
            type: string
            description: A relationship type name
        - in: path
          name: targetEntityId
          required: true
          schema:
            type: string
            description: Target Entity Id
      responses:
        204:
          description: Link deleted
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Source or target entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity/link/{sourceEntityId}/{relationshipTypeName}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get the entities linked to an entity by a relation
      operationId: linkedEntity
      parameters:
        - in: path
          name: sourceEntityId
          required: true
          schema:
            type: string
            description: Source Entity Id
        - in: path
          name: relationshipTypeName
          required: true
          schema:
            type: string
            description: Relationship Type Name
      responses:
        200:
          description: If successful, return a list of linked entities
          content:
            application/json:
              schema:
                type: array
