  /metacatalog/v1/entity:
    post:
      tags:
        - Meta Catalog Manager
      summary: Create an entity
      operationId: createEntity
      requestBody:
        description: An Entity spec
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Entity'
        required: true
      responses:
        200:
          description: If successful, return an entity id
          content:
            text/plain:
              schema:
                type: string
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    get:
      tags:
        - Meta Catalog Manager
      summary: Get a list of entities
      description: >
        Lists entities, optionally narrowed to a single entity type and filtered by a JSON path
        expression. Omit entityTypeName to list entities of every type.
      operationId: getEntities
      parameters:
        - in: query
          name: entityTypeName
          required: false
          description: EntityType name. Omit to list entities of every type.
          schema:
            type: string
        - in: query
          name: queryPath
          required: false
          # No `default:` here on purpose. The generator maps an optional query param to
          # Optional<String>, and springdoc then holds the declared default as an Optional it
          # cannot serialize — which makes GET /api-docs fail with 400 and breaks the Swagger UI.
          # The implementation already treats an absent value as "no filter".
          description: Query path expression. Omit or leave empty to apply no filter.
          schema:
            type: string
      responses:
        200:
          description: If successful, return a list of entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entity'
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: EntityType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity/{id}:
    get:
