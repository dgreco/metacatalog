           description: System problem, details of the error are provided
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/aggregate/{id}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get an aggregate by id
      operationId: getAggregate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            description: Aggregate Id
        - in: query
          name: retrieveMappedEntities
          required: true
          schema:
            type: boolean
            description: if true, retrieve the mapped entities
      responses:
        200:
          description: If successful, return an Aggregate object
          content:
             application/json:
               schema:
                 $ref: '#/components/schemas/Aggregate'
        400:
            description: Invalid input
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ValidationError'
        404:
          description: Aggregate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
           description: System problem
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/aggregate/{id}/yaml:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get an aggregate by id
      operationId: getAggregateAsYaml
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            description: Aggregate Id
        - in: query
          name: retrieveMappedEntities
          required: true
          schema:
            type: boolean
            description: if true, retrieve the mapped entities
      responses:
        200:
          description: If successful, return an Aggregate object as a YAML file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        400:
            description: Invalid input
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ValidationError'
        404:
          description: Aggregate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
           description: System problem
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/SystemError'
components:
  schemas:
    Trait:
      required:
        - id
        - name
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        schema:
          type: string
        inheritsFrom:
          type: string
        version:
          type: integer
          readOnly: true
          description: The current version number of this trait (starts at 1, bumped on every new version).
        versionGroupId:
          type: string
          readOnly: true
          description: Stable identifier grouping every version of the same logical trait.
    EntityType:
      required:
        - id
        - name
        - schema
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        schema:
          type: string
        traits:
          type: array
          items:
            type: string
        inheritsFrom:
          type: string
        version:
          type: integer
          readOnly: true
          description: The current version number of this entity type (starts at 1, bumped on every new version).
        versionGroupId:
          type: string
          readOnly: true
          description: Stable identifier grouping every version of the same logical entity type.
    Aggregate:
      required:
        - id
        - entityType
        - values
      type: object
      properties:
        id:
          type: string
        entityType:
          type: string
        values:
          type: string
        dependencies:
          type: array
          items:
            type: string
        parts:
          type: array
          items:
            schema:
              $ref: '#/components/schemas/Aggregate'
    Entity:
      required:
        - id
        - entityType
        - values
      type: object
      properties:
        id:
          type: string
          readOnly: true
        entityType:
          type: string
        entityTypeVersionId:
          type: string
          readOnly: true
          description: >
            The id of the EntityTypeVersion snapshot this entity is pinned to. Set by the
            service on create; an entity stays pinned to the schema it was validated against
            at creation time even after a new version of the type is created. Null for legacy
            entities created before pinning was introduced.
        values:
          type: string
    Mapping:
      required:
        - id
        - sourceEntityType
        - targetEntityType
        - mappingValues
        - entityPathReferences
      type: object
      properties:
        id:
          type: string
          readOnly: true
        sourceEntityType:
          type: string
        targetEntityType:
          type: string
        mappingValues:
          type: string
        entityPathReferences:
          type: string
    ValidationError:
      required:
        - errors
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
    SystemError:
      required:
        - error
      type: object
      properties:
        error:
          type: string
