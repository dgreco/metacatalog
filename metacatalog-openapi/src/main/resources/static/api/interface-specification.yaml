openapi: "3.1.0"
info:
  version: 1.0.0
  title: Meta Catalog Manager API
  description: >
    REST API for managing metadata: traits, entity types, entities, relationships,
    mappings, aggregates, and version history. Entities are validated against JSON
    Schemas derived from their entity type and traits. Relationships between traits
    and entities are bidirectional. Mappings define how entities of one type are
    derived from entities of another. Aggregates compose entities from parts and
    dependencies. All versioned resources support a full version history with
    snapshot-based rollback.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Meta Catalog Manager
    description: Metadata management operations for traits, entity types, entities, mappings, and aggregates.
paths:
  /metacatalog/v1/bulk-creation:
    post:
      tags:
        - Meta Catalog Manager
      summary: Bulk creation of traits, entity types and entities
      description: >
        Accepts a YAML document (or multiple YAML documents) and creates all
        contained traits, entity types, relationships, mappings, and entities in
        a single transaction.
      operationId: bulkCreation
      requestBody:
        description: A YAML file containing one or more YAML documents
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        204:
          description: Bulk creation successful
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/trait:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get all traits
      operationId: listTraits
      responses:
        200:
          description: If successful, return a list of Trait objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trait'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    post:
      tags:
        - Meta Catalog Manager
      summary: Create a user-defined trait
      operationId: createTrait
      requestBody:
        description: A Trait spec
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Trait'
        required: true
      responses:
        204:
          description: Trait created
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/trait/{name}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get a trait by name
      operationId: getTrait
      parameters:
        - in: path
          name: name
          required: true
          description: Trait name
          schema:
            type: string
      responses:
        200:
          description: If successful, return a Trait object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trait'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Trait not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete a trait by name
      operationId: deleteTrait
      parameters:
        - in: path
          name: name
          required: true
          description: Trait name
          schema:
            type: string
      responses:
        204:
          description: Trait deleted
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Trait not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    head:
      tags:
        - Meta Catalog Manager
      summary: Check if a trait exists by name
      operationId: existsTrait
      parameters:
        - in: path
          name: name
          required: true
          description: Trait name
          schema:
            type: string
      responses:
        200:
          description: Trait exists
        404:
          description: Trait does not exist
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/trait/{name}/versions:
    get:
      tags:
        - Meta Catalog Manager
      summary: List all versions of a trait
      operationId: listTraitVersions
      parameters:
        - in: path
          name: name
          required: true
          description: Trait name
          schema:
            type: string
      responses:
        200:
          description: If successful, return a list of Trait objects (oldest version first, live version last)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trait'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Trait not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    post:
      tags:
        - Meta Catalog Manager
      summary: Create a new version of a trait
      description: >
        Snapshots the current live trait into the history table and mutates the live row with the
        new schema and father. The version number is auto-generated as a progressive integer.
      operationId: createTraitVersion
      parameters:
        - in: path
          name: name
          required: true
          description: Trait name
          schema:
            type: string
      requestBody:
        description: The new Trait spec for the new version
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Trait'
        required: true
      responses:
        200:
          description: If successful, return the new current (live) Trait
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trait'
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Trait not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/trait/{name}/versions/{version}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get a specific version of a trait
      operationId: getTraitVersion
      parameters:
        - in: path
          name: name
          required: true
          description: Trait name
          schema:
            type: string
        - in: path
          name: version
          required: true
          description: Version number
          schema:
            type: integer
      responses:
        200:
          description: If successful, return a Trait object frozen at the requested version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trait'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Trait or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete a specific historical version of a trait
      description: >
        Deletes the version snapshot and relinks the version chain. The current (live) version
        cannot be deleted through this endpoint.
      operationId: deleteTraitVersion
      parameters:
        - in: path
          name: name
          required: true
          description: Trait name
          schema:
            type: string
        - in: path
          name: version
          required: true
          description: Version number
          schema:
            type: integer
      responses:
        204:
          description: Version deleted
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Trait not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/trait/link:
    post:
      tags:
        - Meta Catalog Manager
      summary: Create a link between two traits by a relation
      operationId: linkTrait
      requestBody:
        description: A Link Trait spec
        content:
          application/json:
            schema:
              required:
                - sourceTrait
                - relationshipTypeName
                - targetTrait
              type: object
              properties:
                sourceTrait:
                  type: string
                  description: Source trait name
                relationshipTypeName:
                  type: string
                  description: Relationship type name (DEPENDS_ON, HAS_PART, MAPPED_TO)
                targetTrait:
                  type: string
                  description: Target trait name
        required: true
      responses:
        204:
          description: Trait link created
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Source or target trait not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/trait/link/{sourceTrait}/{relationshipTypeName}/{targetTrait}:
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete a link between two traits by a relation
      description: >
        Removes the relationship and its inverse. Refused with 400 when an existing link
        between entity instances relies on it: such a link is only admitted because a trait
        relationship sanctions it, so removing the last one that does would leave the link
        with nothing justifying it. Remove the instance link first. A link that another trait
        relationship also sanctions does not block the removal.
      operationId: unlinkTrait
      parameters:
        - in: path
          name: sourceTrait
          required: true
          description: Source Trait name
          schema:
            type: string
        - in: path
          name: relationshipTypeName
          required: true
          description: A relationship type name
          schema:
            type: string
        - in: path
          name: targetTrait
          required: true
          description: Target Trait name
          schema:
            type: string
      responses:
        204:
          description: Link deleted
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Source or target trait not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    head:
      tags:
        - Meta Catalog Manager
      summary: Check if a link exists between two traits by a relation
      operationId: existsLinkTrait
      parameters:
        - in: path
          name: sourceTrait
          required: true
          description: Source Trait name
          schema:
            type: string
        - in: path
          name: relationshipTypeName
          required: true
          description: A relationship type name
          schema:
            type: string
        - in: path
          name: targetTrait
          required: true
          description: Target Trait name
          schema:
            type: string
      responses:
        200:
          description: Link exists
        404:
          description: Link does not exist
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/trait/link/{sourceTrait}/{relationshipTypeName}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get the traits linked to a trait by a relation
      operationId: linkedTrait
      parameters:
        - in: path
          name: sourceTrait
          required: true
          description: Source Trait name
          schema:
            type: string
        - in: path
          name: relationshipTypeName
          required: true
          description: Relationship Type Name
          schema:
            type: string
      responses:
        200:
          description: If successful, return a list of linked traits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trait'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Source trait not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/trait/relationships:
    get:
      tags:
        - Meta Catalog Manager
      summary: List all trait relationships
      operationId: listTraitRelationships
      responses:
        200:
          description: If successful, return a list of all trait relationships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TraitRelationship'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/trait/versions:
    get:
      tags:
        - Meta Catalog Manager
      summary: List every trait version snapshot
      description: >
        Returns the frozen version snapshots of every trait, across all traits. Live rows are
        not included — list them with GET /trait. Intended for clients that need the whole
        version history at once, such as the catalog graph.
      operationId: listAllTraitVersions
      responses:
        200:
          description: If successful, return every trait version snapshot
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trait'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity-type:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get all entity types
      operationId: listEntityTypes
      responses:
        200:
          description: If successful, return a list of EntityType objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityType'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    post:
      tags:
        - Meta Catalog Manager
      summary: Create a user-defined type
      operationId: createEntityType
      requestBody:
        description: An EntityType spec
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityType'
        required: true
      responses:
        204:
          description: EntityType created
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity-type/{name}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get a user-defined type by name
      operationId: getEntityType
      parameters:
        - in: path
          name: name
          required: true
          description: EntityType name
          schema:
            type: string
      responses:
        200:
          description: If successful, return an EntityType object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityType'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: EntityType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete a user-defined type by name
      operationId: deleteEntityType
      parameters:
        - in: path
          name: name
          required: true
          description: EntityType name
          schema:
            type: string
      responses:
        204:
          description: Type deleted
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: EntityType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    head:
      tags:
        - Meta Catalog Manager
      summary: Check if a user-defined type exists by name
      operationId: existsEntityType
      parameters:
        - in: path
          name: name
          required: true
          description: EntityType name
          schema:
            type: string
      responses:
        200:
          description: EntityType exists
        404:
          description: EntityType does not exist
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity-type/{name}/versions:
    get:
      tags:
        - Meta Catalog Manager
      summary: List all versions of an entity type
      operationId: listEntityTypeVersions
      parameters:
        - in: path
          name: name
          required: true
          description: EntityType name
          schema:
            type: string
      responses:
        200:
          description: If successful, return a list of EntityType objects (oldest version first, live version last)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityType'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: EntityType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    post:
      tags:
        - Meta Catalog Manager
      summary: Create a new version of an entity type
      description: >
        Snapshots the current live entity type into the history table and mutates the live row with
        the new schema, traits, and father. The version number is auto-generated as a progressive
        integer.
      operationId: createEntityTypeVersion
      parameters:
        - in: path
          name: name
          required: true
          description: EntityType name
          schema:
            type: string
      requestBody:
        description: The new EntityType spec for the new version
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityType'
        required: true
      responses:
        200:
          description: If successful, return the new current (live) EntityType
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityType'
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: EntityType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity-type/{name}/versions/{version}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get a specific version of an entity type
      operationId: getEntityTypeVersion
      parameters:
        - in: path
          name: name
          required: true
          description: EntityType name
          schema:
            type: string
        - in: path
          name: version
          required: true
          description: Version number
          schema:
            type: integer
      responses:
        200:
          description: If successful, return an EntityType object frozen at the requested version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityType'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: EntityType or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete a specific historical version of an entity type
      description: >
        Deletes the version snapshot and relinks the version chain. The current (live) version
        cannot be deleted through this endpoint.
      operationId: deleteEntityTypeVersion
      parameters:
        - in: path
          name: name
          required: true
          description: EntityType name
          schema:
            type: string
        - in: path
          name: version
          required: true
          description: Version number
          schema:
            type: integer
      responses:
        204:
          description: Version deleted
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: EntityType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity-type/versions:
    get:
      tags:
        - Meta Catalog Manager
      summary: List every entity type version snapshot
      description: >
        Returns the frozen version snapshots of every entity type, across all types. Live rows
        are not included — list them with GET /entity-type. Intended for clients that need the
        whole version history at once, such as the catalog graph.
      operationId: listAllEntityTypeVersions
      responses:
        200:
          description: If successful, return every entity type version snapshot
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityType'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/mapping:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get all mappings
      operationId: listMappings
      responses:
        200:
          description: If successful, return a list of Mapping objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Mapping'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    post:
      tags:
        - Meta Catalog Manager
      summary: Create or replace a mapping
      description: >
        Creates a mapping between two entity types, defining how entities of the source type
        are derived from entities of the target type. The mapping values are SpEL expressions
        evaluated against the source entity; entity path references describe how to traverse
        from source to target via relationships. A (source, target) pair holds at most one
        mapping: if one already exists it is replaced in place — same id, new values, re-validated
        against the target schema and re-stamped with the current type versions — so entities
        already derived through it stay attached instead of a second instance being derived.
      operationId: createMapping
      requestBody:
        description: A Mapping spec
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mapping'
      responses:
        204:
          description: Mapping created
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Source or target EntityType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/mapping/entity-relationships:
    get:
      tags:
        - Meta Catalog Manager
      summary: List all mapping relationships between entity instances
      description: >
        Returns the instance-level MAPPED_TO / IS_MAPPED_BY relationships produced by the
        mapping engine, together with the mapping rule that generated each one. These are
        entity-to-entity links, unlike GET /mapping which lists the type-level mapping rules.
      operationId: listMappingEntityRelationships
      responses:
        200:
          description: If successful, return all mapping relationships between entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MappingEntityRelationship'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/mapping/{id}:
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete a mapping by id
      operationId: deleteMapping
      parameters:
        - in: path
          name: id
          required: true
          description: Mapping id
          schema:
            type: string
      responses:
        204:
          description: Mapping deleted
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Mapping not found
          content:
            application/json:
              schema:
