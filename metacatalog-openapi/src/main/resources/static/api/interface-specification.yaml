openapi: "3.1.0"
info:
  version: 1.0.0
  title: Meta Catalog Manager API
  description: >
    REST API for managing metadata: traits, entity types, entities, relationships,
    mappings, aggregates, and version history. Entities are validated against JSON
    Schemas derived from their entity type and traits. Relationships between traits
    and entities are bidirectional. Mappings define how entities of one type are
    derived from entities of another. Aggregates compose entities from parts and
    dependencies. All versioned resources support a full version history with
    snapshot-based rollback.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Meta Catalog Manager
    description: Metadata management operations for traits, entity types, entities, mappings, and aggregates.
paths:
  /metacatalog/v1/bulk-creation:
    post:
      tags:
        - Meta Catalog Manager
      summary: Bulk creation of traits, entity types and entities
      description: >
        Accepts a YAML document (or multiple YAML documents) and creates all
        contained traits, entity types, relationships, mappings, and entities in
        a single transaction.
      operationId: bulkCreation
      requestBody:
        description: A YAML file containing one or more YAML documents
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        204:
          description: Bulk creation successful
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/trait:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get all traits
      operationId: listTraits
      responses:
        200:
          description: If successful, return a list of Trait objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trait'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    post:
      tags:
        - Meta Catalog Manager
      summary: Create a user-defined trait
      operationId: createTrait
      requestBody:
        description: A Trait spec
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Trait'
        required: true
      responses:
        204:
          description: Trait created
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/trait/{name}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get a trait by name
      operationId: getTrait
      parameters:
        - in: path
          name: name
          required: true
          description: Trait name
          schema:
            type: string
      responses:
        200:
          description: If successful, return a Trait object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trait'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Trait not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete a trait by name
      operationId: deleteTrait
      parameters:
        - in: path
          name: name
          required: true
          description: Trait name
          schema:
            type: string
      responses:
        204:
          description: Trait deleted
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Trait not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    head:
      tags:
        - Meta Catalog Manager
      summary: Check if a trait exists by name
      operationId: existsTrait
      parameters:
        - in: path
          name: name
          required: true
          description: Trait name
          schema:
            type: string
      responses:
        200:
          description: Trait exists
        404:
          description: Trait does not exist
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/trait/{name}/versions:
    get:
      tags:
        - Meta Catalog Manager
      summary: List all versions of a trait
      operationId: listTraitVersions
      parameters:
        - in: path
          name: name
          required: true
          description: Trait name
          schema:
            type: string
      responses:
        200:
          description: If successful, return a list of Trait objects (oldest version first, live version last)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trait'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Trait not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    post:
      tags:
        - Meta Catalog Manager
      summary: Create a new version of a trait
      description: >
        Snapshots the current live trait into the history table and mutates the live row with the
        new schema and father. The version number is auto-generated as a progressive integer.
      operationId: createTraitVersion
      parameters:
        - in: path
          name: name
          required: true
          description: Trait name
          schema:
            type: string
      requestBody:
        description: The new Trait spec for the new version
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Trait'
        required: true
      responses:
        200:
          description: If successful, return the new current (live) Trait
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trait'
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Trait not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/trait/{name}/versions/{version}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get a specific version of a trait
      operationId: getTraitVersion
      parameters:
        - in: path
          name: name
          required: true
          description: Trait name
          schema:
            type: string
        - in: path
          name: version
          required: true
          description: Version number
          schema:
            type: integer
      responses:
        200:
          description: If successful, return a Trait object frozen at the requested version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trait'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Trait or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete a specific historical version of a trait
      description: >
        Deletes the version snapshot and relinks the version chain. The current (live) version
        cannot be deleted through this endpoint.
      operationId: deleteTraitVersion
      parameters:
        - in: path
          name: name
          required: true
          description: Trait name
          schema:
            type: string
        - in: path
          name: version
          required: true
          description: Version number
          schema:
            type: integer
      responses:
        204:
          description: Version deleted
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Trait not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/trait/link:
    post:
      tags:
        - Meta Catalog Manager
      summary: Create a link between two traits by a relation
      operationId: linkTrait
      requestBody:
        description: A Link Trait spec
        content:
          application/json:
            schema:
              required:
                - sourceTrait
                - relationshipTypeName
                - targetTrait
              type: object
              properties:
                sourceTrait:
                  type: string
                  description: Source trait name
                relationshipTypeName:
                  type: string
                  description: Relationship type name (DEPENDS_ON, HAS_PART, MAPPED_TO)
                targetTrait:
                  type: string
                  description: Target trait name
        required: true
      responses:
        204:
          description: Trait link created
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Source or target trait not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/trait/link/{sourceTrait}/{relationshipTypeName}/{targetTrait}:
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete a link between two traits by a relation
      operationId: unlinkTrait
      parameters:
        - in: path
          name: sourceTrait
          required: true
          description: Source Trait name
          schema:
            type: string
        - in: path
          name: relationshipTypeName
          required: true
          description: A relationship type name
          schema:
            type: string
        - in: path
          name: targetTrait
          required: true
          description: Target Trait name
          schema:
            type: string
      responses:
        204:
          description: Link deleted
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Source or target trait not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    head:
      tags:
        - Meta Catalog Manager
      summary: Check if a link exists between two traits by a relation
      operationId: existsLinkTrait
      parameters:
        - in: path
          name: sourceTrait
          required: true
          description: Source Trait name
          schema:
            type: string
        - in: path
          name: relationshipTypeName
          required: true
          description: A relationship type name
          schema:
            type: string
        - in: path
          name: targetTrait
          required: true
          description: Target Trait name
          schema:
            type: string
      responses:
        200:
          description: Link exists
        404:
          description: Link does not exist
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/trait/link/{sourceTrait}/{relationshipTypeName}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get the traits linked to a trait by a relation
      operationId: linkedTrait
      parameters:
        - in: path
          name: sourceTrait
          required: true
          description: Source Trait name
          schema:
            type: string
        - in: path
          name: relationshipTypeName
          required: true
          description: Relationship Type Name
          schema:
            type: string
      responses:
        200:
          description: If successful, return a list of linked traits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trait'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Source trait not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity-type:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get all entity types
      operationId: listEntityTypes
      responses:
        200:
          description: If successful, return a list of EntityType objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityType'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    post:
      tags:
        - Meta Catalog Manager
      summary: Create a user-defined type
      operationId: createEntityType
      requestBody:
        description: An EntityType spec
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityType'
        required: true
      responses:
        204:
          description: EntityType created
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity-type/{name}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get a user-defined type by name
      operationId: getEntityType
      parameters:
        - in: path
          name: name
          required: true
          description: EntityType name
          schema:
            type: string
      responses:
        200:
          description: If successful, return an EntityType object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityType'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: EntityType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete a user-defined type by name
      operationId: deleteEntityType
      parameters:
        - in: path
          name: name
          required: true
          description: EntityType name
          schema:
            type: string
      responses:
        204:
          description: Type deleted
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: EntityType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    head:
      tags:
        - Meta Catalog Manager
      summary: Check if a user-defined type exists by name
      operationId: existsEntityType
      parameters:
        - in: path
          name: name
          required: true
          description: EntityType name
          schema:
            type: string
      responses:
        200:
          description: EntityType exists
        404:
          description: EntityType does not exist
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity-type/{name}/versions:
    get:
      tags:
        - Meta Catalog Manager
      summary: List all versions of an entity type
      operationId: listEntityTypeVersions
      parameters:
        - in: path
          name: name
          required: true
          description: EntityType name
          schema:
            type: string
      responses:
        200:
          description: If successful, return a list of EntityType objects (oldest version first, live version last)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityType'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: EntityType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    post:
      tags:
        - Meta Catalog Manager
      summary: Create a new version of an entity type
      description: >
        Snapshots the current live entity type into the history table and mutates the live row with
        the new schema, traits, and father. The version number is auto-generated as a progressive
        integer.
      operationId: createEntityTypeVersion
      parameters:
        - in: path
          name: name
          required: true
          description: EntityType name
          schema:
            type: string
      requestBody:
        description: The new EntityType spec for the new version
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityType'
        required: true
      responses:
        200:
          description: If successful, return the new current (live) EntityType
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityType'
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: EntityType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity-type/{name}/versions/{version}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get a specific version of an entity type
      operationId: getEntityTypeVersion
      parameters:
        - in: path
          name: name
          required: true
          description: EntityType name
          schema:
            type: string
        - in: path
          name: version
          required: true
          description: Version number
          schema:
            type: integer
      responses:
        200:
          description: If successful, return an EntityType object frozen at the requested version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityType'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: EntityType or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete a specific historical version of an entity type
      description: >
        Deletes the version snapshot and relinks the version chain. The current (live) version
        cannot be deleted through this endpoint.
      operationId: deleteEntityTypeVersion
      parameters:
        - in: path
          name: name
          required: true
          description: EntityType name
          schema:
            type: string
        - in: path
          name: version
          required: true
          description: Version number
          schema:
            type: integer
      responses:
        204:
          description: Version deleted
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: EntityType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/mapping:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get all mappings
      operationId: listMappings
      responses:
        200:
          description: If successful, return a list of Mapping objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Mapping'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    post:
      tags:
        - Meta Catalog Manager
      summary: Create a mapping
      description: >
        Creates a mapping between two entity types, defining how entities of the source type
        are derived from entities of the target type. The mapping values are SpEL expressions
        evaluated against the source entity; entity path references describe how to traverse
        from source to target via relationships.
      operationId: createMapping
      requestBody:
        description: A Mapping spec
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mapping'
      responses:
        204:
          description: Mapping created
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Source or target EntityType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/mapping/{id}:
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete a mapping by id
      operationId: deleteMapping
      parameters:
        - in: path
          name: id
          required: true
          description: Mapping id
          schema:
            type: string
      responses:
        204:
          description: Mapping deleted
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Mapping not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity:
    post:
      tags:
        - Meta Catalog Manager
      summary: Create an entity
      operationId: createEntity
      requestBody:
        description: An Entity spec
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Entity'
        required: true
      responses:
        200:
          description: If successful, return an entity id
          content:
            text/plain:
              schema:
                type: string
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    get:
      tags:
        - Meta Catalog Manager
      summary: Get a list of entities
      operationId: getEntities
      parameters:
        - in: query
          name: entityTypeName
          required: true
          description: EntityType name
          schema:
            type: string
        - in: query
          name: queryPath
          required: true
          description: Query path expression
          schema:
            type: string
      responses:
        200:
          description: If successful, return a list of entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entity'
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: EntityType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity/{id}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get an entity by id
      operationId: getEntity
      parameters:
        - in: path
          name: id
          required: true
          description: Entity Id
          schema:
            type: string
      responses:
        200:
          description: If successful, return an Entity object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    put:
      tags:
        - Meta Catalog Manager
      summary: Update an entity by id
      description: >
        Replaces the values of an existing entity. The entity type cannot be changed.
        Entities whose type is the target of a mapping relationship cannot be updated
        through this endpoint.
      operationId: updateEntity
      parameters:
        - in: path
          name: id
          required: true
          description: Entity Id
          schema:
            type: string
      requestBody:
        description: An Entity spec with the new values
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Entity'
        required: true
      responses:
        204:
          description: Entity updated
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete an entity by id
      operationId: deleteEntity
      parameters:
        - in: path
          name: id
          required: true
          description: Entity Id
          schema:
            type: string
      responses:
        204:
          description: Entity deleted
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    head:
      tags:
        - Meta Catalog Manager
      summary: Check if an entity exists by id
      operationId: existsEntity
      parameters:
        - in: path
          name: id
          required: true
          description: Entity id
          schema:
            type: string
      responses:
        200:
          description: Entity exists
        404:
          description: Entity does not exist
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity/link:
    post:
      tags:
        - Meta Catalog Manager
      summary: Create a link between two entities by a relation
      operationId: linkEntity
      requestBody:
        description: A Link Entity spec
        content:
          application/json:
            schema:
              required:
                - sourceEntityId
                - relationshipTypeName
                - targetEntityId
              type: object
              properties:
                sourceEntityId:
                  type: string
                  description: Source entity id
                relationshipTypeName:
                  type: string
                  description: Relationship type name (DEPENDS_ON, HAS_PART, MAPPED_TO)
                targetEntityId:
                  type: string
                  description: Target entity id
        required: true
      responses:
        204:
          description: Entity link created
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Source or target entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity/link/{sourceEntityId}/{relationshipTypeName}/{targetEntityId}:
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete a link between two entities by a relation
      operationId: unlinkEntity
      parameters:
        - in: path
          name: sourceEntityId
          required: true
          description: Source Entity Id
          schema:
            type: string
        - in: path
          name: relationshipTypeName
          required: true
          description: A relationship type name
          schema:
            type: string
        - in: path
          name: targetEntityId
          required: true
          description: Target Entity Id
          schema:
            type: string
      responses:
        204:
          description: Link deleted
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Source or target entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity/link/{sourceEntityId}/{relationshipTypeName}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get the entities linked to an entity by a relation
      operationId: linkedEntity
      parameters:
        - in: path
          name: sourceEntityId
          required: true
          description: Source Entity Id
          schema:
            type: string
        - in: path
          name: relationshipTypeName
          required: true
          description: Relationship Type Name
          schema:
            type: string
      responses:
        200:
          description: If successful, return a list of linked entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entity'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Source entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/aggregate/yaml:
    post:
      tags:
        - Meta Catalog Manager
      summary: Create an aggregate
      description: >
        Accepts a YAML document containing one or more aggregate definitions and creates
        them in a single transaction. Each aggregate is an entity of an aggregate entity type,
        composed of parts (other entities) and dependencies.
      operationId: createAggregateAsYaml
      requestBody:
        description: A YAML file containing one or more aggregate YAML documents
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        204:
          description: Aggregates created
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/aggregate/{id}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get an aggregate by id
      operationId: getAggregate
      parameters:
        - in: path
          name: id
          required: true
          description: Aggregate Id
          schema:
            type: string
        - in: query
          name: retrieveMappedEntities
          required: true
          description: If true, retrieve the mapped entities
          schema:
            type: boolean
      responses:
        200:
          description: If successful, return an Aggregate object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aggregate'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Aggregate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/aggregate/{id}/yaml:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get an aggregate by id as YAML
      description: >
        Returns the aggregate as a YAML file. Same data as the JSON variant
        (GET /aggregate/{id}) but serialized as YAML.
      operationId: getAggregateAsYaml
      parameters:
        - in: path
          name: id
          required: true
          description: Aggregate Id
          schema:
            type: string
        - in: query
          name: retrieveMappedEntities
          required: true
          description: If true, retrieve the mapped entities
          schema:
            type: boolean
      responses:
        200:
          description: If successful, return an Aggregate object as a YAML file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Aggregate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
components:
  schemas:
    Trait:
      type: object
      description: A reusable characteristic contributing schema properties to entity types.
      required:
        - name
      properties:
        id:
          type: string
          readOnly: true
          description: Server-generated unique identifier.
        name:
          type: string
          description: Unique trait name.
        schema:
          type: string
          description: JSON Schema string defining the trait's properties. Defaults to an empty schema if omitted.
        inheritsFrom:
          type: string
          description: Name of the parent trait this trait inherits from, or null for a root trait.
        version:
          type: integer
          readOnly: true
          description: The current version number of this trait (starts at 1, bumped on every new version).
        versionGroupId:
          type: string
          readOnly: true
          description: Stable identifier grouping every version of the same logical trait.
    EntityType:
      type: object
      description: A type definition for entities, with a JSON Schema and optional traits.
      required:
        - name
        - schema
      properties:
        id:
          type: string
          readOnly: true
          description: Server-generated unique identifier.
        name:
          type: string
          description: Unique entity type name.
        schema:
          type: string
          description: JSON Schema string defining the entity type's properties.
        traits:
          type: array
          items:
            type: string
          description: Names of the traits associated with this entity type.
        inheritsFrom:
          type: string
          description: Name of the parent entity type this type inherits from, or null for a root type.
        version:
          type: integer
          readOnly: true
          description: The current version number of this entity type (starts at 1, bumped on every new version).
        versionGroupId:
          type: string
          readOnly: true
          description: Stable identifier grouping every version of the same logical entity type.
    Aggregate:
      type: object
      description: >
        An aggregate entity composed of parts (other entities) and dependencies.
        Aggregates are created from aggregate entity types and can include mapped entities.
      required:
        - entityType
        - values
      properties:
        id:
          type: string
          readOnly: true
          description: Server-generated unique identifier.
        entityType:
          type: string
          description: Name of the entity type this aggregate belongs to.
        values:
          type: string
          description: JSON string containing the aggregate's values, validated against the entity type's schema.
        dependencies:
          type: array
          items:
            type: string
          description: Ids of entities this aggregate depends on.
        parts:
          type: array
          items:
            $ref: '#/components/schemas/Aggregate'
          description: Sub-aggregates that compose this aggregate.
    Entity:
      type: object
      description: A concrete instance of an entity type, with JSON values validated against the type's schema.
      required:
        - entityType
        - values
      properties:
        id:
          type: string
          readOnly: true
          description: Server-generated unique identifier.
        entityType:
          type: string
          description: Name of the entity type this entity belongs to.
        entityTypeVersionId:
          type: string
          readOnly: true
          description: >
            The id of the EntityTypeVersion snapshot this entity is pinned to. Set by the
            service on create; an entity stays pinned to the schema it was validated against
            at creation time even after a new version of the type is created. Null for legacy
            entities created before pinning was introduced.
        values:
          type: string
          description: JSON string containing the entity's values, validated against the entity type's schema.
    Mapping:
      type: object
      description: >
        A mapping between two entity types, defining how source entities are derived from
        target entities via SpEL expressions and relationship path traversal.
      required:
        - sourceEntityType
        - targetEntityType
        - mappingValues
        - entityPathReferences
      properties:
        id:
          type: string
          readOnly: true
          description: Server-generated unique identifier.
        sourceEntityType:
          type: string
          description: Name of the source entity type.
        targetEntityType:
          type: string
          description: Name of the target entity type.
        mappingValues:
          type: string
          description: JSON string of SpEL expressions mapping source fields to target fields.
        entityPathReferences:
          type: string
          description: JSON string of entity path references describing relationship traversal from source to target.
    ValidationError:
      type: object
      description: Error response for client-side errors (4xx), listing all validation errors.
      required:
        - errors
      properties:
        errors:
          type: array
          items:
            type: string
          description: List of validation error messages.
    SystemError:
      type: object
      description: Error response for server-side errors (5xx).
      required:
        - error
      properties:
        error:
          type: string
          description: System error message.
