              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity/relationships:
    get:
      tags:
        - Meta Catalog Manager
      summary: List all relationships between entity instances
      description: >
        Returns every entity-to-entity relationship, in both directions (each link is stored
        with its inverse). Use GET /entity/link/{sourceEntityId}/{relationshipTypeName} to
        traverse from a single entity instead.
      operationId: listEntityRelationships
      responses:
        200:
          description: If successful, return all entity relationships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityRelationship'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity/link:
    post:
      tags:
        - Meta Catalog Manager
      summary: Create a link between two entities by a relation
      operationId: linkEntity
      requestBody:
        description: A Link Entity spec
        content:
          application/json:
            schema:
              required:
                - sourceEntityId
                - relationshipTypeName
                - targetEntityId
              type: object
              properties:
                sourceEntityId:
                  type: string
                  description: Source entity id
                relationshipTypeName:
                  type: string
                  description: Relationship type name (DEPENDS_ON, HAS_PART, MAPPED_TO)
                targetEntityId:
                  type: string
                  description: Target entity id
        required: true
      responses:
        204:
          description: Entity link created
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Source or target entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity/link/{sourceEntityId}/{relationshipTypeName}/{targetEntityId}:
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete a link between two entities by a relation
      description: >
        Removes the link and its inverse. Refused when the link is the containment of a part in an
        aggregate (delete the aggregate instead), or when an existing mapping resolves one of its
        entity path references through the link — removing it would break the derivation of the
        mapped entities. Delete or re-create the mapping first.
      operationId: unlinkEntity
      parameters:
        - in: path
          name: sourceEntityId
          required: true
          description: Source Entity Id
          schema:
            type: string
        - in: path
          name: relationshipTypeName
          required: true
          description: A relationship type name
          schema:
            type: string
        - in: path
          name: targetEntityId
          required: true
          description: Target Entity Id
          schema:
            type: string
      responses:
        204:
          description: Link deleted
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Source or target entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/entity/link/{sourceEntityId}/{relationshipTypeName}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get the entities linked to an entity by a relation
      operationId: linkedEntity
      parameters:
        - in: path
          name: sourceEntityId
          required: true
          description: Source Entity Id
          schema:
            type: string
        - in: path
          name: relationshipTypeName
          required: true
          description: Relationship Type Name
          schema:
            type: string
      responses:
        200:
          description: If successful, return a list of linked entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entity'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Source entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/aggregate/root-type:
    get:
      tags:
        - Meta Catalog Manager
      summary: List the aggregate root entity types
      description: >
        Returns the entity types that can start an aggregate. A root type has a HAS_PART
        relationship towards at least one other type but is never itself a part of another
        type. Composition is declared between traits; a type participates by mixing them in.
      operationId: listAggregateRootTypes
      responses:
        200:
          description: The aggregate root entity types, ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityType'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/aggregate/provisionable-type:
    get:
      tags:
        - Meta Catalog Manager
      summary: List the provisionable entity types
      description: >
        Returns the entity types whose instances can be provisioned — those carrying the
        Provisionable trait, directly or through the type and trait inheritance chains. This is
        the same test the provisioning procedure applies to an aggregate root, so a client can
        tell in advance which entities offer provisioning rather than discovering it from a
        rejected call.
      operationId: listProvisionableTypes
      responses:
        200:
          description: The provisionable entity types, ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityType'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/aggregate/root-type/{name}/schema:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get the combined JSON Schema of an aggregate
      description: >
        Returns a single self-contained JSON Schema describing the whole aggregate tree
        reachable from the given root type. Every reachable entity type contributes an
        entry under $defs and containment is expressed with $ref, so the schema stays
        finite even when the composition graph is cyclic. A document written against this
        schema can be submitted to POST /metacatalog/v1/aggregate/yaml.
      operationId: getAggregateSchema
      parameters:
        - in: path
          name: name
          required: true
          description: The name of the aggregate root entity type
          schema:
            type: string
      responses:
        200:
          description: The combined JSON Schema for the aggregate
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        400:
          description: The entity type is not an aggregate root
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Entity type not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/aggregate/yaml:
    post:
      tags:
        - Meta Catalog Manager
      summary: Create an aggregate
      description: >
        Accepts a YAML document containing one or more aggregate definitions and creates
        them in a single transaction. Each aggregate is an entity of an aggregate entity type,
        composed of parts (other entities) and dependencies.
      operationId: createAggregateAsYaml
      requestBody:
        description: A YAML file containing one or more aggregate YAML documents
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        204:
          description: Aggregates created
        400:
          description: Invalid input; details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem, details of the error are provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/aggregate/{id}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get an aggregate by id
      operationId: getAggregate
      parameters:
        - in: path
          name: id
          required: true
          description: Aggregate Id
          schema:
            type: string
        - in: query
          name: retrieveMappedEntities
          required: true
          description: If true, retrieve the mapped entities
          schema:
            type: boolean
      responses:
        200:
          description: If successful, return an Aggregate object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aggregate'
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Aggregate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
    delete:
      tags:
        - Meta Catalog Manager
      summary: Delete an aggregate by id
      description: >-
        Deletes the aggregate as a whole: the root entity, every entity it contains through
        HAS_PART, and the entities derived from those through MAPPED_TO. The request is refused
        when a member of the aggregate is linked to an entity outside it.
      operationId: deleteAggregate
      parameters:
        - in: path
          name: id
          required: true
          description: Aggregate Id
          schema:
            type: string
      responses:
        204:
          description: Aggregate deleted
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Aggregate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/aggregate/{id}/yaml:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get an aggregate by id as YAML
      description: >
        Returns the aggregate as a YAML file. Same data as the JSON variant
        (GET /aggregate/{id}) but serialized as YAML.
      operationId: getAggregateAsYaml
      parameters:
        - in: path
          name: id
          required: true
          description: Aggregate Id
          schema:
            type: string
        - in: query
          name: retrieveMappedEntities
          required: true
          description: If true, retrieve the mapped entities
          schema:
            type: boolean
      responses:
        200:
          description: If successful, return an Aggregate object as a YAML file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Aggregate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/aggregate/{id}/provision:
    post:
      tags:
        - Meta Catalog Manager
      summary: Provision an aggregate
      description: >-
        Provisions every ProvisionableResource in the aggregate, running the task registered for
        each resource's entity type in dependency order — a resource is provisioned only once
        everything it is derived from exists. The aggregate root must carry the Provisionable
        trait. Synchronous by default: the call returns once the whole aggregate is done, and
        fails if any resource did. With async=true the plan is still built and validated
        synchronously (a missing aggregate or an illegitimate root fails immediately), but the
        call returns 202 with a schedule id to poll via GET /procedure/{scheduleId}. Each
        resource is left PROVISIONED, or FAILED with the error in provisioningResult.
      operationId: provisionAggregate
      parameters:
        - in: path
          name: id
          required: true
          description: Aggregate Id
          schema:
            type: string
        - in: query
          name: async
          required: false
          description: >-
            When true, return immediately after plan-building with a schedule id to poll instead
            of waiting for the run to complete. Absent or false means synchronous.
          schema:
            type: boolean
      responses:
        204:
          description: Aggregate provisioned (synchronous mode)
        202:
          description: Provisioning started (async mode); poll GET /procedure/{scheduleId}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureStatus'
        400:
          description: >-
            Invalid input, the root is not Provisionable, a resource type has no registered task,
            or provisioning failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Aggregate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/aggregate/{id}/unprovision:
    post:
      tags:
        - Meta Catalog Manager
      summary: Unprovision an aggregate
      description: >-
        The inverse of provisioning: tears down every ProvisionableResource in the aggregate, in
        the reverse of the order they were provisioned, so nothing is removed while another
        resource still depends on it. Synchronous by default, like provisioning; async=true
        behaves exactly as it does there. Each resource is left UNPROVISIONED, or FAILED with the
        error in provisioningResult.
      operationId: unprovisionAggregate
      parameters:
        - in: path
          name: id
          required: true
          description: Aggregate Id
          schema:
            type: string
        - in: query
          name: async
          required: false
          description: >-
            When true, return immediately after plan-building with a schedule id to poll instead
            of waiting for the run to complete. Absent or false means synchronous.
          schema:
            type: boolean
      responses:
        204:
          description: Aggregate unprovisioned (synchronous mode)
        202:
          description: Unprovisioning started (async mode); poll GET /procedure/{scheduleId}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureStatus'
        400:
          description: >-
            Invalid input, the root is not Provisionable, a resource type has no registered task,
            or unprovisioning failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Aggregate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /metacatalog/v1/procedure/{scheduleId}:
    get:
      tags:
        - Meta Catalog Manager
      summary: Get the status of an asynchronously launched procedure run
      description: >-
        Polls a run started with async=true on the provision or unprovision endpoint. Statuses are
        kept in a durable registry shared by every application instance, so any replica can answer
        the poll and a run's outcome survives restarts. Rows are cleaned up after
        application.config.procedureRunRetention (default 24h), after which the id reads as not
        found; a RUNNING row that old is first marked FAILED, since the instance executing it is
        gone.
      operationId: getProcedureStatus
      parameters:
        - in: path
          name: scheduleId
          required: true
          description: The schedule id returned by the async provision/unprovision call
          schema:
            type: string
      responses:
        200:
          description: The run's current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureStatus'
        404:
          description: Unknown schedule id (never existed, or cleaned up by retention)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
components:
  schemas:
    Trait:
      type: object
      description: A reusable characteristic contributing schema properties to entity types.
      required:
        - name
      properties:
        id:
          type: string
          readOnly: true
          description: Server-generated unique identifier.
        name:
          type: string
          description: Unique trait name.
        schema:
          type: string
          description: JSON Schema string defining the trait's properties. Defaults to an empty schema if omitted.
        inheritsFrom:
          type: string
          description: Name of the parent trait this trait inherits from, or null for a root trait.
        version:
          type: integer
          readOnly: true
          description: The current version number of this trait (starts at 1, bumped on every new version).
        versionGroupId:
          type: string
          readOnly: true
          description: Stable identifier grouping every version of the same logical trait.
        previousVersionId:
          type: string
          readOnly: true
          description: >
            For a version snapshot, the id of the snapshot it succeeds, or null for the first
            version. Always null for a live row.
    EntityType:
      type: object
      description: A type definition for entities, with a JSON Schema and optional traits.
      required:
        - name
        - schema
      properties:
        id:
          type: string
          readOnly: true
          description: Server-generated unique identifier.
        name:
          type: string
          description: Unique entity type name.
        schema:
          type: string
          description: JSON Schema string defining the entity type's properties.
        traits:
          type: array
          items:
            type: string
          description: Names of the traits associated with this entity type.
        inheritsFrom:
          type: string
          description: Name of the parent entity type this type inherits from, or null for a root type.
        version:
          type: integer
          readOnly: true
          description: The current version number of this entity type (starts at 1, bumped on every new version).
        versionGroupId:
          type: string
          readOnly: true
          description: Stable identifier grouping every version of the same logical entity type.
        previousVersionId:
          type: string
          readOnly: true
          description: >
            For a version snapshot, the id of the snapshot it succeeds, or null for the first
            version. Always null for a live row.
    Aggregate:
      type: object
      description: >
        An aggregate entity composed of parts (other entities) and dependencies.
        Aggregates are created from aggregate entity types and can include mapped entities.
      required:
        - entityType
        - values
      properties:
        id:
          type: string
          readOnly: true
          description: Server-generated unique identifier.
        entityType:
          type: string
          description: Name of the entity type this aggregate belongs to.
        values:
          type: string
          description: JSON string containing the aggregate's values, validated against the entity type's schema.
        dependencies:
          type: array
          items:
            type: string
          description: Ids of entities this aggregate depends on.
        parts:
          type: array
          items:
            $ref: '#/components/schemas/Aggregate'
          description: Sub-aggregates that compose this aggregate.
    Entity:
      type: object
      description: A concrete instance of an entity type, with JSON values validated against the type's schema.
      required:
        - entityType
        - values
        - entityTypeVersionId
      properties:
        id:
          type: string
          readOnly: true
          description: Server-generated unique identifier.
        entityType:
          type: string
          description: Name of the entity type this entity belongs to.
        entityTypeVersionId:
          type: string
          readOnly: true
          description: >
            The id of the EntityTypeVersion snapshot this entity is pinned to. Set by the
            service on create; an entity stays pinned to the schema it was validated against
            at creation time even after a new version of the type is created. Always present
            on read; must not be sent on create (readOnly).
        values:
          type: string
          description: JSON string containing the entity's values, validated against the entity type's schema.
    Mapping:
      type: object
      description: >
        A mapping between two entity types, defining how source entities are derived from
        target entities via SpEL expressions and relationship path traversal.
      required:
        - sourceEntityType
        - targetEntityType
        - mappingValues
        - entityPathReferences
      properties:
        id:
          type: string
          readOnly: true
          description: Server-generated unique identifier.
        sourceEntityType:
          type: string
          description: Name of the source entity type.
        targetEntityType:
          type: string
          description: Name of the target entity type.
        sourceEntityTypeVersion:
          type: integer
          readOnly: true
          description: >
            The version of the source entity type this mapping was defined against, frozen at
            mapping creation. Set by the service; must not be sent on create.
        targetEntityTypeVersion:
          type: integer
          readOnly: true
          description: >
            The version of the target entity type this mapping was defined — and its values
            validated — against, frozen at mapping creation. Set by the service; must not be
            sent on create.
        mappingValues:
          type: string
          description: JSON string of SpEL expressions mapping source fields to target fields.
        entityPathReferences:
          type: string
          description: JSON string of entity path references describing relationship traversal from source to target.
    TraitRelationship:
      type: object
      description: A directed relationship between two traits.
      properties:
        id:
          type: string
          readOnly: true
          description: Server-generated unique identifier for the relationship.
        sourceTrait:
          type: string
          description: Name of the source trait.
        targetTrait:
          type: string
          description: Name of the target trait.
        relationType:
          type: string
          description: The relationship type name (DEPENDS_ON, HAS_PART, MAPPED_TO, IS_REQUIRED_BY, IS_PART_OF, IS_MAPPED_BY).
    EntityRelationship:
      type: object
      description: A directed relationship between two entity instances.
      properties:
        id:
          type: string
          readOnly: true
          description: Server-generated unique identifier for the relationship.
        sourceEntityId:
          type: string
          description: Id of the source entity.
        targetEntityId:
          type: string
          description: Id of the target entity.
        relationType:
          type: string
          description: The relationship type name (DEPENDS_ON, HAS_PART, IS_REQUIRED_BY, IS_PART_OF).
    MappingEntityRelationship:
      type: object
      description: >
        An instance-level mapping relationship, linking a source entity to the entity derived
        from it, together with the mapping rule that produced it.
      properties:
        id:
          type: string
          readOnly: true
          description: Server-generated unique identifier for the relationship.
        sourceEntityId:
          type: string
          description: Id of the source entity.
        targetEntityId:
          type: string
          description: Id of the mapped (target) entity.
        relationType:
          type: string
          description: The relationship type name (MAPPED_TO, IS_MAPPED_BY).
        mappingValues:
          type: string
          description: The mapping rule's SpEL expressions, as a JSON string. Null when the rule is no longer available.
        entityPathReferences:
          type: string
          description: The mapping rule's entity path references, as a JSON string. Null when the rule is no longer available.
    ProcedureStatus:
      type: object
      description: A point-in-time view of an asynchronously launched procedure run.
      required:
        - scheduleId
        - status
      properties:
        scheduleId:
          type: string
          description: The schedule id identifying the run.
        status:
          type: string
          enum: [RUNNING, SUCCEEDED, FAILED]
          description: The run's current state.
        error:
          type: string
          description: The failure message; present only when status is FAILED.
    ValidationError:
      type: object
      description: Error response for client-side errors (4xx), listing all validation errors.
      required:
        - errors
      properties:
        errors:
          type: array
          items:
            type: string
          description: List of validation error messages.
    SystemError:
      type: object
      description: Error response for server-side errors (5xx).
      required:
        - error
      properties:
        error:
          type: string
          description: System error message.
