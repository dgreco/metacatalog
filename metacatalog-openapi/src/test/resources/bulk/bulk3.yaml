entityType: "DataProductType"
values:
  name: "dp1"
  # The access policy GET /aggregate/{id}/access reports back. dp2 below deliberately declares
  # none, so the endpoint is exercised both ways.
  principals:
    - id: "analysts"
      type: "GROUP"
      description: "Reads the published data"
    - id: "dp1-loader"
      type: "SERVICE"
  permissions:
    - name: "READ"
    - name: "WRITE"
  grants:
    - principals: ["analysts"]
      permissions: ["READ"]
    - principals: ["dp1-loader"]
      permissions: ["READ", "WRITE"]
      resources:
        entityTypes: ["S3FolderType"]

parts:

- ref: "op1"
  entityType: "FileBasedOutputPortType"
  values:
    name: "op1"

- ref: "op2"
  entityType: "TableBasedOutputPortType"
  values:
    name: "op2"
  dependsOn:
     - "op1"

---
entityType: "DataProductType"
values:
  name: "dp2"

parts:

- ref: "op3"
  entityType: "FileBasedOutputPortType"
  values:
    name: "op3"

- ref: "op4"
  entityType: "TableBasedOutputPortType"
  values:
    name: "op4"
  dependsOn:
     - "op3"
