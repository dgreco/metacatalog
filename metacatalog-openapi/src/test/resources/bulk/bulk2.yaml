Traits:
  - name: WithName
    schema:
      type: object
      properties:
        name:
          type: string
  - name: DataProduct
  - name: DataProductComponent
  - name: OutputPort
    inheritsFrom: DataProductComponent

---
Relationships:
  - sourceTrait: DataProduct
    relationshipType: HAS_PART
    targetTrait: DataProductComponent

---
EntityTypes:

  - name: DataProductType
    schema:
      type: object
      properties: {}
    traits:
      - Aggregate
      - WithName

  - name: OutputPortType
    schema:
      type: object
      properties: {}
    traits:
      - Aggregate
      - AggregateElement
      - WithName
      - OutputPort

  - name: FileBasedOutputPortType
    schema:
        type: object
        properties: {}
    inheritsFrom: OutputPortType

  - name: TableBasedOutputPortType
    schema:
      type: object
      properties: {}
    inheritsFrom: OutputPortType

  - name: S3FolderType
    schema:
      type: object
      properties:
        bucket:
          type: string
        path:
          type: string
    traits:
      - AggregateElement

---
Mappings:
  - sourceEntityType: FileBasedOutputPortType
    targetEntityType: S3FolderType
    mappingValues:
      path: "'/root/'+ #dp.getValue('$.name').asText() + '/' + #source.getValue('$.name').asText()"
      bucket: "'my-bucket'"
    entityPathReferences:
      - alias: "dp"
        referencePath: "HAS_PART{$}"
