services:
  postgres:
    image: postgres:18.4-alpine
    container_name: metacatalog-postgres
    environment:
      POSTGRES_DB: metacatalog
      POSTGRES_USER: metacatalog
      POSTGRES_PASSWORD: metacatalog
      # The 18.x images moved the default data dir to /var/lib/postgresql/<major>/docker
      # mid-line; the postgres-data volume predates that, so pin PGDATA to the old
      # location or the entrypoint refuses to start on the existing cluster.
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metacatalog -d metacatalog"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: metacatalog:0.0.1-SNAPSHOT
    container_name: metacatalog-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/metacatalog
      SPRING_DATASOURCE_USERNAME: metacatalog
      SPRING_DATASOURCE_PASSWORD: metacatalog
    ports:
      - "8080:8080"
    healthcheck:
      # readiness, not health: it turns UP only after the ApplicationRunners finish, so the
      # bulk-loader waiting on service_healthy cannot post a model before the built-in traits exist.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  bulk-loader:
    image: curlimages/curl:8.10.1
    container_name: metacatalog-bulk-loader
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./docker/bulk:/bulk:ro
    environment:
      APP_URL: http://app:8080
      METACATALOG_USER: admin
      METACATALOG_PASSWORD: admin
    entrypoint: ["/bin/sh", "/bulk/load-bulk.sh"]
    restart: "no"

volumes:
  postgres-data:
