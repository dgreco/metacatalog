<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Meta Catalog — SPARQL</title>
    <!-- Shared theme system: app.css tokens + topbar/.btn/.logout-form, theme.js applies the
         chosen theme before first paint and mounts the toggle into .topbar nav.
         These assets are owned by metacatalog-ui and served from its static resources; the
         metacatalog-application module always includes metacatalog-ui on the classpath so they
         are available at runtime. -->
    <link rel="stylesheet" th:href="@{/ui/css/app.css}"/>
    <script th:src="@{/ui/js/theme.js}"></script>
    <!-- Yasgui (SPARQL query editor + results visualiser) — served locally for air-gapped/offline deployments. -->
    <link rel="stylesheet" th:href="@{/sparql/vendor/yasgui.min.css}"/>
    <style>
        /* The Yasgui editor needs the full viewport height below the topbar; app.css sizes main
           to a 1000px column, which would clip it, so let the SPARQL page span the viewport. */
        main.sparql-main { max-width: none; margin: 0; padding: 0.85rem 1.5rem; }
        .sparql-meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
        .sparql-meta code { background: var(--panel-2); padding: 0.05rem 0.32rem; border-radius: var(--radius-xs); }
        #yasgui { height: calc(100vh - 130px); }
    </style>
</head>
<body>
<header class="topbar">
    <h1>Meta Catalog — SPARQL</h1>
    <nav>
        <a class="btn" th:href="@{/ui/}">← Back to UI</a>
    </nav>
    <form method="post" th:action="@{/logout}" class="logout-form" th:if="${authenticated}">
        <span class="user" th:text="${username}">user</span>
        <button type="submit" class="btn">Logout</button>
    </form>
</header>
<main class="sparql-main">
    <div class="sparql-meta">
        Endpoint: <code><a th:href="${endpoint}" th:text="${endpoint}">/sparql/query</a></code>
        &nbsp;·&nbsp;
        Ontology IRI: <code><a th:href="${ontologyIri}" target="_blank" rel="noopener noreferrer" th:text="${ontologyIri}">http://metacatalog/</a></code>
    </div>
    <div id="yasgui"></div>
</main>
<script th:src="@{/sparql/vendor/yasgui.min.js}"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    const endpoint = /*[[${endpoint}]]*/ '/sparql/query';
    const defaultQuery = /*[[${defaultQuery}]]*/ 'SELECT ?s ?p ?o WHERE { ?s ?p ?o } LIMIT 50';
    const yasgui = new Yasgui(document.getElementById("yasgui"), {
        requestConfig: { endpoint: endpoint },
        endpointInfoOptions: { endpoint: endpoint },
    });
    // Pre-fill the first tab with the default query.
    const firstTab = yasgui.getTab();
    if (firstTab) {
        firstTab.setQuery(defaultQuery);
    }
    // IRIs in the result table are virtual RDF identifiers (e.g. http://metacatalog/Trait/{id})
    // from the Ontop mapping — they are not real HTTP URLs. Intercept clicks on result IRIs and
    // run a DESCRIBE query in a new Yasgui tab so the user sees all triples about that resource
    // instead of a browser "cannot connect" error.
    document.getElementById("yasgui").addEventListener("click", function (e) {
        const a = e.target.closest("a.iri");
        if (!a) return;
        e.preventDefault();
        const iri = a.getAttribute("href");
        const tab = yasgui.addTab(true, { requestConfig: { endpoint: endpoint } });
        tab.setQuery("DESCRIBE <" + iri + ">");
        tab.query();
    });
    /*]]>*/
</script>
</body>
</html>
