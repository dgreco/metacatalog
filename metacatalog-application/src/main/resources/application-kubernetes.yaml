spring:
  config:
    activate:
      on-profile: "kubernetes"
  # Database configuration is provided via environment variables
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
    enabled: true
  override-with-generic-response: false
  auto-tag-classes: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,db
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework.data.jpa.repository: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    it.davidgreco: INFO

application:
  config:
    automaticEntitiesMapping: true
    updateMappedEntitiesSchedulingInterval: 5s
    entityLifeCycleEventCleanupSchedulingInterval: 5s
    entityPathResolutionMaxAttempts: 3
