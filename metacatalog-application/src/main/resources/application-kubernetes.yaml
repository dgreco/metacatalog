spring:
  config:
    activate:
      on-profile: "kubernetes"
  # Database configuration is provided via environment variables
  # (SPRING_DATASOURCE_URL / USERNAME / PASSWORD) which override the base application.yaml values.
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  shutdown: graceful
springdoc:
  override-with-generic-response: false
  auto-tag-classes: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,db
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
logging:
  level:
    root: INFO
    org.springframework.data.jpa.repository: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    it.davidgreco: INFO
application:
  config:
    updateMappedEntitiesSchedulingInterval: 5s
    security:
      # Authentication mechanism: none | basic | oauth2 | ldap
      # In Kubernetes prefer oauth2 (with an external IdP) or ldap. Override via env vars:
      #   APPLICATION_CONFIG_SECURITY_AUTH_MODE, APPLICATION_CONFIG_SECURITY_OAUTH2_JWK_SET_URI, ...
      auth-mode: none
