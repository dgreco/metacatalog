spring:
  config:
    activate:
      on-profile: "default"
  datasource:
    url: jdbc:postgresql://localhost:5432/metacatalog
    username: metacatalog
    password: metacatalog
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  lifecycle:
    timeout-per-shutdown-phase: 10s
server:
  port: 8080
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /api/interface-specification.yaml
  api-docs:
    path: /api-docs
    enabled: true
endpoints:
  flyway:
    web:
      enabled: true
application:
  config:
    automaticEntitiesMapping: true
    updateMappedEntitiesSchedulingInterval: 1s
    entityLifeCycleEventCleanupSchedulingInterval: 1s
    entityPathResolutionMaxAttempts: 3