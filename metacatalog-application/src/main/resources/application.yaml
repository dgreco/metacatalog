spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/metacatalog
    username: metacatalog
    password: metacatalog
    driverClassName: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      # Use 'none' since Flyway manages the schema; validation happens at runtime through queries
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  lifecycle:
    timeout-per-shutdown-phase: 10s
server:
  port: 8080
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
    enabled: true
management:
  endpoints:
    web:
      exposure:
        # env, configprops, beans, loggers intentionally excluded: they leak DB passwords, basic-auth
        # hashes and other secrets. Enable them only behind an authenticated management port.
        include: health, info, flyway, metrics, caches
  info:
    git:
      enabled: true
      mode: simple       # expose only the short commit id; 'full' leaks branch, build time, etc.
    build:
      enabled: true      # expose build.version / build.time at /actuator/info
    java:
      enabled: false
logging:
  level:
    root: ERROR                                # General logging level for the application
    org.springframework.data.jpa.repository: ERROR  # Log JPA repository method calls
    org.hibernate.SQL: ERROR                   # Log SQL statements executed by Hibernate
    org.hibernate.type.descriptor.sql: ERROR   # Log SQL parameter binding
    it.davidgreco.metacatalog.BuildInfoLogger: INFO # allow the startup version line through
application:
  config:
    automaticEntitiesMapping: true
    updateMappedEntitiesSchedulingInterval: 1s
    entityPathResolutionMaxAttempts: 3
    # taskScheduleCacheMaxSize: 100           # TaskManager schedule-result cache capacity
    # taskScheduleCacheExpireAfterWrite: 1h   # TaskManager schedule-result cache TTL
    cacheExpireAfterWrite: 1h                 # Spring cache (Traits, EntityTypes) TTL
    provisioning:
      # Entity types whose provisioning is handled by the stdout task, which prints what it would
      # provision and unprovision instead of creating or destroying anything. A ProvisionableResource
      # type not listed here has no registered task, and provisioning it fails with
      # "No factory for name: <type>" rather than being reported as provisioned by nothing.
      entity-types: []
    security:
      # Authentication mechanism: none | basic | oauth2 | ldap
      # - none   : security disabled (default for local dev)
      # - basic  : HTTP Basic with users defined statically below
      # - oauth2 : JWT resource server (e.g. Keycloak) - see application.config.security.oauth2
      # - ldap   : LDAP bind authentication - see application.config.security.ldap
      auth-mode: none
      # basic:
      #   users:
      #     - username: admin
      #       password: "{noop}secret"        # use {noop} for plain text, {bcrypt}... for production
      #       roles: [USER, ADMIN]
      # oauth2:
      #   # Either jwk-set-uri or issuer-uri must be set.
      #   jwk-set-uri: http://localhost:8090/realms/metacatalog/protocol/openid-connect/certs
      #   issuer-uri: http://localhost:8090/realms/metacatalog
      #   # Setting client-id (and client-secret) enables browser SSO via the OIDC
      #   # authorization-code flow: the UI redirects to the IdP, and after login the
      #   # session is reused by the API chain (Swagger "Try it out" works without
      #   # re-authentication, mirroring basic/ldap). Requires issuer-uri (not jwk-set-uri).
      #   # client-id: metacatalog
      #   # client-secret: secret
      # ldap:
      #   url: ldap://localhost:389
      #   base: dc=example,dc=com
      #   user-dn-pattern: uid={0},ou=people
      #   # user-search-base: ou=people
      #   # user-search-filter: (uid={0})
      #   # manager-dn: cn=admin,dc=example,dc=com
      #   # manager-password: admin
  sparql:
    enabled: true
    mapping: classpath:ontop/mapping.obda
    ontology: classpath:ontop/ontology.owl
    endpoint: /sparql/query
    ontology-iri: http://metacatalog/
    default-query: |-
      PREFIX mt: <http://metacatalog/>
      SELECT ?s ?p ?o WHERE { ?s ?p ?o } LIMIT 50
