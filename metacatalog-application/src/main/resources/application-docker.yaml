spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/metacatalog
    username: "${SPRING_DATASOURCE_USERNAME:metacatalog}"
    password: "${SPRING_DATASOURCE_PASSWORD:metacatalog}"
logging:
  level:
    root: INFO
    org.flywaydb: INFO
    org.springframework.boot.autoconfigure.flyway: INFO
    org.springframework.boot.autoconfigure: INFO
    org.springframework.data.jpa.repository: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql: INFO
application:
  config:
    updateMappedEntitiesSchedulingInterval: 30s
    security:
      auth-mode: basic
      basic:
        users:
          - username: admin
            # Dev-only bcrypt hash. Override the hash portion via BASIC_AUTH_PASSWORD before any
            # non-local deployment. The {bcrypt} prefix selects the DelegatingPasswordEncoder scheme.
            password: "{bcrypt}${BASIC_AUTH_PASSWORD:$2y$10$vyd.7trh61R1yBJ64.v2JuyASeLgON5pPiPP3NRQmHFxLjde06lSO}"
            roles: [USER, ADMIN]
      # oauth2:
      #   jwk-set-uri: http://keycloak:8080/realms/metacatalog/protocol/openid-connect/certs
      #   issuer-uri: http://keycloak:8080/realms/metacatalog
