spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/metacatalog
    username: "${SPRING_DATASOURCE_USERNAME:metacatalog}"
    password: "${SPRING_DATASOURCE_PASSWORD:metacatalog}"
    driverClassName: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      # Use 'none' since Flyway manages the schema; validation happens at runtime through queries
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  lifecycle:
    timeout-per-shutdown-phase: 10s
server:
  port: 8080
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
    enabled: true
management:
  endpoints:
    web:
      exposure:
        # env, configprops, beans, loggers intentionally excluded: they leak DB passwords, basic-auth
        # hashes and other secrets. Enable them only behind an authenticated management port.
        include: health, info, flyway, metrics, caches
logging:
  level:
    root: INFO
    org.flywaydb: INFO
    org.springframework.boot.autoconfigure.flyway: INFO
    org.springframework.boot.autoconfigure: INFO
    org.springframework.data.jpa.repository: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql: INFO
application:
  config:
    automaticEntitiesMapping: true
    updateMappedEntitiesSchedulingInterval: 30s
    entityPathResolutionMaxAttempts: 3
    security:
      # Authentication mechanism: none | basic | oauth2 | ldap
      auth-mode: basic
      basic:
        users:
          - username: admin
            # Dev-only bcrypt hash. Override the hash portion via BASIC_AUTH_PASSWORD before any
            # non-local deployment. The {bcrypt} prefix selects the DelegatingPasswordEncoder scheme.
            password: "{bcrypt}${BASIC_AUTH_PASSWORD:$2y$10$vyd.7trh61R1yBJ64.v2JuyASeLgON5pPiPP3NRQmHFxLjde06lSO}"
            roles: [USER, ADMIN]
      # oauth2:
      #   jwk-set-uri: http://keycloak:8080/realms/metacatalog/protocol/openid-connect/certs
      #   issuer-uri: http://keycloak:8080/realms/metacatalog
      # ldap:
      #   url: ldap://ldap:389
      #   user-dn-pattern: uid={0},ou=people
