spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/metacatalog
    username: "${SPRING_DATASOURCE_USERNAME:metacatalog}"
    password: "${SPRING_DATASOURCE_PASSWORD:metacatalog}"
# No logging overrides: application.yaml already sets root to ERROR, and this profile raising
# everything to INFO is what made `make run` unreadable. The startup version line still comes
# through — application.yaml keeps BuildInfoLogger at INFO — and the provisioning output is written
# to standard output rather than logged, so it is unaffected by the level.
application:
  config:
    updateMappedEntitiesSchedulingInterval: 1s
    provisioning:
      # The ProvisionableResource types of the demo model in docker/bulk/bulk-model.yaml, all
      # handled by the stdout task. Listing them here rather than in application.yaml keeps the
      # demo's types out of the shipped defaults: an installation with a different model names its
      # own.
      tasks:
        stdout:
          entity-types: [S3FolderType, AthenaTableType]
          # Pause per resource, so an asynchronous run's progress is observable: the UI's
          # provisioning banner polls for ~10s (2 resources x 5s) instead of finishing
          # before the first poll.
          delay: 5s
        script:
          # The Iceberg data-product demo (docker-compose.iceberg.yml overlay): each
          # output port of the demo aggregate is provisioned as a real table in the
          # Iceberg REST catalog by the script the overlay mounts. In the base stack
          # the type does not exist and the deferred registrar just logs a warning.
          entity-types: [IcebergTableOutputPortType]
          path: /opt/metacatalog/provisioning/provision-iceberg-table.sh
    security:
      auth-mode: basic
      basic:
        users:
          - username: admin
            # Dev-only bcrypt hash. Override the hash portion via BASIC_AUTH_PASSWORD before any
            # non-local deployment. The {bcrypt} prefix selects the DelegatingPasswordEncoder scheme.
            password: "{bcrypt}${BASIC_AUTH_PASSWORD:$2y$10$vyd.7trh61R1yBJ64.v2JuyASeLgON5pPiPP3NRQmHFxLjde06lSO}"
            roles: [USER, ADMIN]
      # oauth2:
