spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/metacatalog
    username: metacatalog
    password: metacatalog
    driverClassName: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      # Use 'none' since Flyway manages the schema; validation happens at runtime through queries
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  lifecycle:
    timeout-per-shutdown-phase: 10s
server:
  port: 8080
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: beans, caches, health, info, flyway, metrics, env, configprops, loggers
logging:
  level:
    root: INFO
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
    org.springframework.boot.autoconfigure: DEBUG
    org.springframework.data.jpa.repository: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: DEBUG
application:
  config:
    automaticEntitiesMapping: true
    updateMappedEntitiesSchedulingInterval: 1s
    entityLifeCycleEventCleanupSchedulingInterval: 1s
    entityPathResolutionMaxAttempts: 3
    security:
      # Authentication mechanism: none | basic | oauth2 | ldap
      auth-mode: basic
      basic:
        users:
          - username: admin
            password: "{noop}admin"
            roles: [USER, ADMIN]
      # oauth2:
      #   jwk-set-uri: http://keycloak:8080/realms/metacatalog/protocol/openid-connect/certs
      #   issuer-uri: http://keycloak:8080/realms/metacatalog
