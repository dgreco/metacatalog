# Default values for metacatalog.

replicaCount: 1

image:
  # GitLab Container Registry at gitlab.davidgreco.it
  repository: gitlab.davidgreco.it:5050/dgreco/metacatalog
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # Use "latest" or a specific commit SHA (e.g., "abc1234")
  tag: "4.0.1"

# Image pull secrets for private registries (GitLab Container Registry)
# Create secret: kubectl create secret docker-registry gitlab-registry \
#   --docker-server=gitlab.davidgreco.it:5050 \
#   --docker-username=<gitlab-username> \
#   --docker-password=<gitlab-token> \
#   --docker-email=<email>
imagePullSecrets:
  - name: gitlab-registry

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: metacatalog.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: metacatalog-tls
  #    hosts:
  #      - metacatalog.local

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Application configuration
application:
  springProfile: docker
  javaOpts: "-Xms256m -Xmx768m"
  logging:
    level:
      root: INFO
      app: DEBUG  # Logging level for it.davidgreco package

# Database configuration
database:
  # Use external database instead of subchart
  external: false
  host: ""
  port: 5432
  name: metacatalog
  username: metacatalog
  password: metacatalog
  # Use existing secret for credentials
  existingSecret: ""
  existingSecretUsernameKey: "username"
  existingSecretPasswordKey: "password"

# PostgreSQL subchart configuration (Bitnami)
postgresql:
  enabled: true
  auth:
    username: metacatalog
    password: metacatalog
    database: metacatalog
  primary:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
