apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: applications

resources:
  # Secrets are managed manually - not in git
  # Apply them before running kustomize:
  #   kubectl apply -f db-secret.yaml -f registry-secret.yaml
  - cnpg-cluster.yaml
  - cnpg-cluster-scheduled-backup.yaml
  - app-serviceaccount.yaml
  - app-configmap.yaml
  - app-deployment.yaml
  - app-service.yaml
  - app-ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: metacatalog
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true

images:
  - name: gitlab.davidgreco.it:5050/dgreco/metacatalog
    newTag: latest
