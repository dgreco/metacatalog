apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: metacatalog-db
  namespace: applications
  labels:
    app.kubernetes.io/name: metacatalog
    app.kubernetes.io/component: database
spec:
  instances: 1

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      maintenance_work_mem: "128MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "4MB"
      min_wal_size: "1GB"
      max_wal_size: "4GB"

  bootstrap:
    initdb:
      database: metacatalog
      owner: metacatalog
      secret:
        name: metacatalog-db-credentials

  storage:
    size: 5Gi
    storageClass: "ceph-rbd"

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  monitoring:
    enablePodMonitor: false  # Set to true if using Prometheus Operator

  # Backup temporarily disabled - XAmzContentSHA256Mismatch error with MinIO
  # Debug steps:
  # 1. Check if there's a reverse proxy in front of MinIO modifying requests
  # 2. Try accessing MinIO directly without proxy
  # 3. Check MinIO signature version settings (MINIO_SIGNATURE_VERSION=v4)
  # 4. Verify no nginx/traefik is buffering uploads
  #
  # backup:
  #   barmanObjectStore:
  #     destinationPath: s3://postgresql-backups/applications/metacatalog
  #     endpointURL: https://doc.fairytales.local:4443
  #     s3Credentials:
  #       accessKeyId:
  #         name: s3-secret
  #         key: accessKey
  #       secretAccessKey:
  #         name: s3-secret
  #         key: secretKey
  #     endpointCA:
  #       name: s3-ca-tls
  #       key: ca.crt
  #     wal:
  #       maxParallel: 2
  #       compression: gzip
  #     data:
  #       jobs: 2

  managed:
    roles:
    - name: metacatalog
      ensure: present
      login: true
      superuser: false
      passwordSecret:
        name: metacatalog-db-credentials
