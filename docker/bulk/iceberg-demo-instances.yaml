# The demo data product: one aggregate with three Iceberg table output ports.
# Provisioning it (UI instances page or POST /metacatalog/v1/aggregate/{id}/provision)
# creates the three tables in the Iceberg REST catalog under the sales_analytics
# namespace; unprovisioning drops them again.
entityType: "IcebergDataProductType"
values:
  name: "sales_analytics"
  description: "Sales analytics data product exposing its datasets as Iceberg tables"

parts:

- ref: "customers"
  entityType: "IcebergTableOutputPortType"
  values:
    name: "customers"
    namespace: "sales_analytics"
    columns:
      - { name: "customer_id", type: "long", required: true }
      - { name: "name", type: "string", required: true }
      - { name: "email", type: "string" }
      - { name: "created_at", type: "timestamp" }

- ref: "orders"
  entityType: "IcebergTableOutputPortType"
  values:
    name: "orders"
    namespace: "sales_analytics"
    columns:
      - { name: "order_id", type: "long", required: true }
      - { name: "customer_id", type: "long", required: true }
      - { name: "total", type: "double" }
      - { name: "ordered_at", type: "timestamp" }

- ref: "order_items"
  entityType: "IcebergTableOutputPortType"
  values:
    name: "order_items"
    namespace: "sales_analytics"
    columns:
      - { name: "order_id", type: "long", required: true }
      - { name: "sku", type: "string", required: true }
      - { name: "quantity", type: "int" }
      - { name: "price", type: "double" }

# The fourth port is not an Iceberg table. It is an ordinary Parquet dataset described in the Hive
# Metastore, so a consumer that only speaks Hive can read it — the same data product publishing
# through two catalogs, which is the point of the demo. Provisioning creates it over the metastore's
# Thrift protocol on :9083; the three ports above are created over the Iceberg REST catalog on
# :8181. Both end up as entities in the same graph, side by side under this aggregate.
- ref: "returns"
  entityType: "HiveTableOutputPortType"
  values:
    name: "returns"
    database: "sales_analytics"
    location: "s3://iceberg-warehouse/sales_analytics/returns"
    description: "Returned orders, published as Parquet for Hive-speaking consumers"
    columns:
      - { name: "return_id", type: "bigint", comment: "primary key" }
      - { name: "order_id", type: "bigint" }
      - { name: "reason", type: "string" }
      - { name: "refunded", type: "decimal(10,2)" }
      - { name: "returned_at", type: "timestamp" }
