# The demo data product: one aggregate with three Iceberg table output ports and one Hive one.
# Provisioning it (UI instances page or POST /metacatalog/v1/aggregate/{id}/provision)
# creates the three tables in the Iceberg REST catalog under the sales_analytics
# namespace; unprovisioning drops them again.
#
# The same aggregate is also Authorizable: POST /metacatalog/v1/aggregate/{id}/authorize resolves
# the policy below into the grants that apply to each port and stamps them onto the real table it
# produced — Iceberg table properties, Hive table parameters, the same names either side — and
# .../reject withdraws them. That is a second lifecycle, not a second name for the first: a port can
# be provisioned and not granted, and each records its own status. Authorizing before provisioning
# fails naming the table that does not exist yet, which is the point.
#
# The policy lives here, on the root, and nowhere else. The ports carry no audience of their own:
# asking "who can read this data product?" has one place to look, and four ports cannot drift into
# four different answers to it. Which port a grant reaches is said by the grant, through an optional
# selector — which is what lets the finance grant name the Hive port without the Hive port having to
# know it was named.
entityType: "IcebergDataProductType"
values:
  name: "sales_analytics"
  description: "Sales analytics data product exposing its datasets as Iceberg tables"

  # The subjects this data product recognises. Ids as whatever identity provider is behind the
  # deployment knows them; this demo has none, which is exactly why they are plain references and
  # not entities in the catalog.
  principals:
    - id: "sales-analysts"
      type: "GROUP"
      description: "BI team building sales dashboards"
    - id: "crm-analysts"
      type: "GROUP"
      description: "Customer-facing analysts"
    - id: "finance-reporting"
      type: "GROUP"
      description: "Finance, for refund reporting"
    - id: "sales-etl"
      type: "SERVICE"
      description: "The pipeline that loads these tables"

  # What this product can grant. Abstract on purpose: the same two names have to mean the same thing
  # to an Iceberg consumer and a Hive one, and neither catalog's native privilege vocabulary would.
  # Turning READ into whatever a given system understands is the provisioning script's job.
  permissions:
    - name: "READ"
      description: "Query the published data"
    - name: "WRITE"
      description: "Append to it"

  # Four grants, none of which repeats itself on a port:
  #  - the BI team reads everything;
  #  - CRM analysts read only the customers table, selected by value;
  #  - finance reads only the Hive port, selected by entity type;
  #  - the loading pipeline writes everything, and reads it back.
  grants:
    - principals: ["sales-analysts"]
      permissions: ["READ"]
    - principals: ["crm-analysts"]
      permissions: ["READ"]
      resources:
        values:
          name: "customers"
    - principals: ["finance-reporting"]
      permissions: ["READ"]
      resources:
        entityTypes: ["HiveTableOutputPortType"]
    - principals: ["sales-etl"]
      permissions: ["READ", "WRITE"]

parts:

- ref: "customers"
  entityType: "IcebergTableOutputPortType"
  values:
    name: "customers"
    namespace: "sales_analytics"
    columns:
      - { name: "customer_id", type: "long", required: true }
      - { name: "name", type: "string", required: true }
      - { name: "email", type: "string" }
      - { name: "created_at", type: "timestamp" }

- ref: "orders"
  entityType: "IcebergTableOutputPortType"
  values:
    name: "orders"
    namespace: "sales_analytics"
    columns:
      - { name: "order_id", type: "long", required: true }
      - { name: "customer_id", type: "long", required: true }
      - { name: "total", type: "double" }
      - { name: "ordered_at", type: "timestamp" }

- ref: "order_items"
  entityType: "IcebergTableOutputPortType"
  values:
    name: "order_items"
    namespace: "sales_analytics"
    columns:
      - { name: "order_id", type: "long", required: true }
      - { name: "sku", type: "string", required: true }
      - { name: "quantity", type: "int" }
      - { name: "price", type: "double" }

# The fourth port is not an Iceberg table. It is an ordinary Parquet dataset described in the Hive
# Metastore, so a consumer that only speaks Hive can read it — the same data product publishing
# through two catalogs, which is the point of the demo. Provisioning creates it over the metastore's
# Thrift protocol on :9083; the three ports above are created over the Iceberg REST catalog on
# :8181. Both end up as entities in the same graph, side by side under this aggregate.
- ref: "returns"
  entityType: "HiveTableOutputPortType"
  values:
    name: "returns"
    database: "sales_analytics"
    location: "s3://iceberg-warehouse/sales_analytics/returns"
    description: "Returned orders, published as Parquet for Hive-speaking consumers"
    columns:
      - { name: "return_id", type: "bigint", comment: "primary key" }
      - { name: "order_id", type: "bigint" }
      - { name: "reason", type: "string" }
      - { name: "refunded", type: "decimal(10,2)" }
      - { name: "returned_at", type: "timestamp" }
