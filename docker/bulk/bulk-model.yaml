# The demo model for the base stack (docker-compose.yml, loaded by the bulk-loader service).
#
# The data product and the domain are *assets*: aggregate root types carrying the built-in `Asset`
# trait, which is what the Assets half of the UI lists and manages. `Asset` inherits `Provisionable`
# and mixes in `Authorizable`, so an asset type gets both capabilities by naming one trait — the
# data product used to mix the two in itself. Its two resources carry both resource traits:
# provisioning creates the S3 folder and the Athena table, authorization grants access to them, and
# each records into its own pair of status fields on the resource and on the root. Everything here
# is handled by the `stdout` task (see application-docker.yaml), which prints what it would do for
# all four operations instead of touching anything real.
#
# Which asset may depend on which is declared between traits, under Relationships below: a data
# product may belong to a domain, and may consume another data product. Nothing else is allowed — a
# domain cannot be made to depend on a data product — which is what the catalog's drag and drop
# shows when an asset is dropped where it may not go. Only dp1 is seeded: create a DomainType asset
# from the UI and drag dp1 onto it to see a dependency being made.
#
# The data product is also Versionable, so dp1 keeps a version history: it starts at v1, and every
# change to its values adds one. That includes the status write-backs each provision / authorize
# run makes on the root, so the History link on the Instances page grows as you click through the
# lifecycle.

Traits:
  - name: WithName
    schema:
      type: object
      properties:
        name:
          type: string
  - name: DataProduct
  - name: Domain
  - name: DataProductComponent
  - name: OutputPort
    inheritsFrom: DataProductComponent

---
Relationships:

  - sourceTrait: DataProductComponent
    relationshipType: IS_REQUIRED_BY
    targetTrait: DataProductComponent

  # The dependencies allowed between assets.
  - sourceTrait: DataProduct
    relationshipType: DEPENDS_ON
    targetTrait: Domain

  - sourceTrait: DataProduct
    relationshipType: DEPENDS_ON
    targetTrait: DataProduct

---
EntityTypes:

  - name: DomainType
    schema:
      type: object
      properties: {}
    traits:
      - Asset
      - WithName
      - Domain

  - name: DataProductType
    schema:
      type: object
      properties: {}
    traits:
      - Asset
      - Versionable
      - WithName
      - DataProduct

  - name: OutputPortType
    schema:
      type: object
      properties: {}
    traits:
      - Aggregate
      - AggregateElement
      - WithName
      - OutputPort

  - name: FileBasedOutputPortType
    schema:
        type: object
        properties: {}
    inheritsFrom: OutputPortType

  - name: TableBasedOutputPortType
    schema:
      type: object
      properties: {}
    inheritsFrom: OutputPortType

  - name: S3FolderType
    schema:
      type: object
      properties:
        bucket:
          type: string
        path:
          type: string
    traits:
      - ProvisionableResource
      - AuthorizableResource

  - name: AthenaTableType
    schema:
      type: object
      properties:
        database:
          type: string
        table:
          type: string
        dataPath:
          type: string
    traits:
      - ProvisionableResource
      - AuthorizableResource

---
Mappings:

  - sourceEntityType: FileBasedOutputPortType
    targetEntityType: S3FolderType
    mappingValues:
      path: "'/root/'+ #dp.getValue('$.name').asText() + '/' + #source.getValue('$.name').asText()"
      bucket: "'my-bucket'"
    entityPathReferences:
      - alias: "dp"
        referencePath: "HAS_PART{$}"

  - sourceEntityType: TableBasedOutputPortType
    targetEntityType: AthenaTableType
    mappingValues:
      database: "#dp.getValue('$.name').asText()"
      table: "#source.getValue('$.name').asText()"
      dataPath: "#fbo.getValue('$.path').asText()"
    entityPathReferences:
      - alias: "dp"
        referencePath: "HAS_PART{$}"
      - alias: "fbo"
        referencePath: "IS_REQUIRED_BY{$}/MAPPED_TO{$}"
