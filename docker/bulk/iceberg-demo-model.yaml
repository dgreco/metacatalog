# Model for the Iceberg data-product demo (loaded by the iceberg-demo-loader service
# in docker-compose.iceberg.yml, self-contained — it does not depend on the base
# demo model in bulk-model.yaml and coexists with it on a shared postgres volume).
#
# A data product is an aggregate root (Provisionable inherits Aggregate) whose parts
# are Iceberg table output ports (the port trait inherits ProvisionableResource,
# which inherits AggregateElement) — so the built-in
# `Aggregate HAS_PART AggregateElement` relationship sanctions the containment and
# no extra trait relationships are needed.
#
# Each port carries everything the provisioning script needs to create the real
# table in the Iceberg REST catalog: the target namespace, the table name and the
# column list. Provisioning the aggregate runs the `script` task (see
# application-docker.yaml) once per port; the script drives the catalog API.
#
# The data product is also Authorizable, and each port carries AuthorizableResource
# alongside its own port trait, so the same aggregate has a second, independent
# lifecycle: provisioning creates the tables, authorization grants access to them.
# The two are independent by design — a table can exist and not yet be granted —
# and they record into different fields, so neither overwrites the other's answer.
# Authorizing runs the same `script` task in the `authorize` direction, and the
# script stamps the access decision onto the *real* table: Iceberg table
# properties, Hive table parameters. A port's optional `grantee` says who the
# grant is for.
#
# Note the ports mix AuthorizableResource in at the entity-type level rather than
# through their port trait: a trait has single inheritance, and
# IcebergTableOutputPort already inherits ProvisionableResource. Carrying two
# capability traits therefore means carrying two traits, which is exactly what an
# entity type's trait list is for.
#
# The Relationships section sanctions `port DEPENDS_ON IcebergTable`: after the
# script creates the real table, it links the port to the resulting IcebergTable
# entity (the catalog app materializes one per table) — the port's contract is
# fulfilled by the table, so the port depends on it. IcebergTableTrait is
# declared immutable at startup by the catalog app's IcebergModelContributor;
# linking to an immutable trait is legal (the sanction row itself stays
# mutable), but it does mean this model can only load once the iceberg-catalog
# service is up (see depends_on in docker-compose.iceberg.yml).

Traits:
  - name: IcebergTableOutputPort
    inheritsFrom: ProvisionableResource
  # A second kind of output port on the same data product, published as an ordinary Parquet table
  # described in the Hive Metastore rather than as an Iceberg table. Both inherit
  # ProvisionableResource — and so AggregateElement — which is what lets one aggregate contain
  # both, and what makes each of them a resource the provisioning procedure schedules.
  - name: HiveTableOutputPort
    inheritsFrom: ProvisionableResource

---
Relationships:

  - sourceTrait: IcebergTableOutputPort
    relationshipType: DEPENDS_ON
    targetTrait: IcebergTableTrait

  # The same sanction for the Hive port: after the script creates the real table, it links the port
  # to the HiveTable entity the metastore materialised. HiveTableTrait is declared immutable at
  # startup by the Hive metastore app's HiveModelContributor, which is why the demo loader waits for
  # that service to be healthy as well as the Iceberg catalog.
  - sourceTrait: HiveTableOutputPort
    relationshipType: DEPENDS_ON
    targetTrait: HiveTableTrait

---
EntityTypes:

  - name: IcebergDataProductType
    schema:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
    traits:
      - Provisionable
      - Authorizable

  - name: IcebergTableOutputPortType
    schema:
      type: object
      required:
        - name
        - namespace
        - columns
      properties:
        name:
          type: string
        namespace:
          type: string
        columns:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - name
              - type
            properties:
              name:
                type: string
              # An Iceberg primitive type: long, int, string, double, timestamp, ...
              type:
                type: string
              required:
                type: boolean
        # Who the port's data is granted to. Read by the provisioning script when the
        # authorization procedure runs, and stamped onto the real table as
        # `access.granted-to`. Optional: a port with no grantee is granted to
        # `everyone`, which is the honest default for a demo with no identity provider
        # behind it.
        grantee:
          type: string
    traits:
      - IcebergTableOutputPort
      - AuthorizableResource

  # An output port published as a plain Parquet table in the Hive Metastore. The port carries the
  # Hive column types (bigint, string, timestamp) rather than the Iceberg ones (long, string,
  # timestamp) because that is what the metastore stores and a query engine reads — the two
  # catalogs describe the same kind of thing in their own vocabularies, which is precisely why a
  # data product exposing both has to say it twice.
  - name: HiveTableOutputPortType
    schema:
      type: object
      required:
        - name
        - database
        - location
        - columns
      properties:
        name:
          type: string
        database:
          type: string
        # Where the Parquet files live. Nothing writes them here: this is an external table
        # describing data a pipeline produces, which is how Hive external tables are normally used.
        location:
          type: string
        description:
          type: string
        columns:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - name
              - type
            properties:
              name:
                type: string
              # A Hive type: bigint, int, string, double, boolean, timestamp, date,
              # decimal(p,s), array<...>, map<...>, struct<...>
              type:
                type: string
              comment:
                type: string
        # As on the Iceberg port; stamped onto the Hive table as the `access.granted-to`
        # table parameter.
        grantee:
          type: string
    traits:
      - HiveTableOutputPort
      - AuthorizableResource
