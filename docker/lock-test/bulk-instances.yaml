# 200 aggregate instances for the advisory-lock test.
# 200 data products x 2 output ports = 400 SOURCE_CREATED events.
# At ~13ms per mapped entity, one scheduler tick processes all 400 in ~5s,
# during which the other instance's @Scheduled(fixedRate=1s) fires ~5 times
# and each time fails pg_try_advisory_xact_lock -> 'Advisory lock not acquired'.
