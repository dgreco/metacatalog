Traits:
  - name: WithName
    schema:
      type: object
      properties:
        name:
          type: string
  - name: DataProduct
  - name: Domain
  - name: DataProductComponent
  - name: OutputPort
    inheritsFrom: DataProductComponent

---
Relationships:

  - sourceTrait: DataProductComponent
    relationshipType: IS_REQUIRED_BY
    targetTrait: DataProductComponent

  # What an asset may depend on: a data product belongs to a domain.
  - sourceTrait: DataProduct
    relationshipType: DEPENDS_ON
    targetTrait: Domain

---
EntityTypes:

  - name: DomainType
    schema:
      type: object
      properties: {}
    traits:
      - WithName
      - Domain

  - name: DataProductType
    schema:
      type: object
      properties: {}
    traits:
      - Asset
      - Versionable
      - WithName
      - DataProduct

  - name: OutputPortType
    schema:
      type: object
      properties: {}
    traits:
      - Aggregate
      - AggregateElement
      - WithName
      - OutputPort

  - name: FileBasedOutputPortType
    schema:
        type: object
        properties: {}
    inheritsFrom: OutputPortType

  - name: TableBasedOutputPortType
    schema:
      type: object
      properties: {}
    inheritsFrom: OutputPortType

  - name: S3FolderType
    schema:
      type: object
      properties:
        bucket:
          type: string
        path:
          type: string
    traits:
      - ProvisionableResource
      - AuthorizableResource

  - name: AthenaTableType
    schema:
      type: object
      properties:
        database:
          type: string
        table:
          type: string
        dataPath:
          type: string
    traits:
      - ProvisionableResource
      - AuthorizableResource

---
Mappings:

  - sourceEntityType: FileBasedOutputPortType
    targetEntityType: S3FolderType
    mappingValues:
      path: "'/root/' + #domain.getValue('$.name').asText() + '/' + #dp.getValue('$.name').asText() + '/' + #source.getValue('$.name').asText()"
      bucket: "'my-bucket'"
    entityPathReferences:
      - alias: "dp"
        referencePath: "HAS_PART{$}"
      - alias: "domain"
        referencePath: "HAS_PART{$}/IS_REQUIRED_BY{$}"

  - sourceEntityType: TableBasedOutputPortType
    targetEntityType: AthenaTableType
    mappingValues:
      database: "#domain.getValue('$.name').asText() + '_' + #dp.getValue('$.name').asText()"
      table: "#source.getValue('$.name').asText()"
      dataPath: "#fbo.getValue('$.path').asText()"
    entityPathReferences:
      - alias: "dp"
        referencePath: "HAS_PART{$}"
      - alias: "domain"
        referencePath: "HAS_PART{$}/IS_REQUIRED_BY{$}"
      - alias: "fbo"
        referencePath: "IS_REQUIRED_BY{$}/MAPPED_TO{$}"
