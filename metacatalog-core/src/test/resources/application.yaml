spring:
  config:
    activate:
      on-profile: "default"
  datasource:
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  lifecycle:
    timeout-per-shutdown-phase: 5s
application:
  config:
    automaticEntitiesMapping: true
    updateMappedEntitiesSchedulingInterval: 1s
    entityLifeCycleEventCleanupSchedulingInterval: 1d
    entityPathResolutionMaxAttempts: 3
