# GitHub Actions. Mirrors .gitlab-ci.yml: both run ci/build.sh and ci/publish-images.sh,
# so pipeline logic lives in those scripts and this file is only the platform plumbing.
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Testcontainers talks to the runner's own Docker daemon; no DinD service needed here.
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test
        run: ci/build.sh

      # Images are published only from main/master/develop pushes, to the GitHub Container
      # Registry under this repository. GHCR requires a lowercase image path, and
      # github.repository preserves the owner's casing, hence the tr.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish images
        if: github.event_name == 'push'
        env:
          GIT_BRANCH: ${{ github.ref_name }}
        run: |
          IMAGE_BASE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" \
          GIT_SHA="${GITHUB_SHA::7}" \
          ci/publish-images.sh
