variables:
  MAVEN_OPTS: -Dmaven.repo.local=.m2/repository
  TESTCONTAINERS_HOST_OVERRIDE: "host.docker.internal"

image: maven:3-eclipse-temurin-22 

stages:
    - build
    - test

cache:
  paths:
    - .m2/repository
    - target

build_job:
  stage: build
  tags:
    - shared 

  script: 
    - echo "Maven compile started"
    - "mvn compile"


test_job:
  stage: test
  tags:
    - shared 

  script: 
    - echo "Maven test started"
    - "mvn test"
