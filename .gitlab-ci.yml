variables:
  DOCKER_DRIVER: "overlay2"
  TESTCONTAINERS_RYUK_DISABLED: "true"

stages:
  - build
  - helm

# Build, test, and push Docker image
build:
  stage: build
  image: maven:3-eclipse-temurin-25

  cache:
    policy: pull-push
    key: "maven-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/

  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

  before_script:
    # Install Docker CLI
    - apt-get update && apt-get install -y docker.io
    # Use Docker socket if available (mounted by runner), otherwise skip Docker build
    - |
      if [ -S /var/run/docker.sock ]; then
        echo "Using Docker socket"
        export DOCKER_HOST=unix:///var/run/docker.sock
      else
        echo "WARNING: Docker socket not available, Docker builds will be skipped"
        export SKIP_DOCKER_BUILD=true
      fi
    - docker info || export SKIP_DOCKER_BUILD=true

  script:
    # Build and test
    - mvn spotless:check verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -B

    # Build and push Docker images (only on main/master/develop and if Docker is available)
    - |
      if [ "$SKIP_DOCKER_BUILD" != "true" ] && { [ "$CI_COMMIT_BRANCH" == "main" ] || [ "$CI_COMMIT_BRANCH" == "master" ] || [ "$CI_COMMIT_BRANCH" == "develop" ]; }; then
        echo "Building and pushing Docker images..."

        # Build and push with commit SHA tag
        mvn spring-boot:build-image -pl metacatalog-application -B \
          -DskipTests \
          -Ddocker.image.name=${CI_REGISTRY_IMAGE} \
          -Ddocker.image.tag=${CI_COMMIT_SHORT_SHA} \
          -Ddocker.publish=true \
          -Ddocker.registry.url=${CI_REGISTRY} \
          -Ddocker.registry.username=${CI_REGISTRY_USER} \
          -Ddocker.registry.password=${CI_REGISTRY_PASSWORD}

        # Build and push with 'latest' tag
        mvn spring-boot:build-image -pl metacatalog-application -B \
          -DskipTests \
          -Ddocker.image.name=${CI_REGISTRY_IMAGE} \
          -Ddocker.image.tag=latest \
          -Ddocker.publish=true \
          -Ddocker.registry.url=${CI_REGISTRY} \
          -Ddocker.registry.username=${CI_REGISTRY_USER} \
          -Ddocker.registry.password=${CI_REGISTRY_PASSWORD}

        # Also tag with version on main/master
        if [ "$CI_COMMIT_BRANCH" == "main" ] || [ "$CI_COMMIT_BRANCH" == "master" ]; then
          VERSION=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          mvn spring-boot:build-image -pl metacatalog-application -B \
            -DskipTests \
            -Ddocker.image.name=${CI_REGISTRY_IMAGE} \
            -Ddocker.image.tag=${VERSION} \
            -Ddocker.publish=true \
            -Ddocker.registry.url=${CI_REGISTRY} \
            -Ddocker.registry.username=${CI_REGISTRY_USER} \
            -Ddocker.registry.password=${CI_REGISTRY_PASSWORD}
        fi
      else
        echo "Skipping Docker build (Docker not available or not on main/master/develop branch)"
      fi

  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'

# Package Helm chart
helm:package:
  stage: helm
  image: alpine/helm:3.14.0

  script:
    # Update Chart.yaml with current version
    - |
      VERSION=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
      sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" helm/metacatalog/Chart.yaml

    # Update dependencies
    - helm dependency update helm/metacatalog

    # Lint the chart
    - helm lint helm/metacatalog

    # Package the chart
    - helm package helm/metacatalog --destination ./helm-packages

  artifacts:
    paths:
      - helm-packages/*.tgz
    expire_in: 1 week

  rules:
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
