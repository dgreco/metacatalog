variables:
  MAVEN_OPTS: -Dmaven.repo.local=.m2/repository
  TESTCONTAINERS_HOST_OVERRIDE: "tcp://docker:2375"

image: maven:3-eclipse-temurin-22 

stages:
    - build
    - test

cache:
  paths:
    - .m2/repository
    - target

build_job:
  stage: build
  tags:
    - shared 

  script: 
    - echo "Maven compile started"
    - "mvn compile"


test_job:
  stage: test
  tags:
    - shared 
  services:
    - docker:26.1.2-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2

  script:
    - echo "Running tests..."
    - mvn test

  allow_failure: false