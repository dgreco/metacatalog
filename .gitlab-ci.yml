services:
  - name: docker:24-dind
    alias: docker

variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: "overlay2"
  TESTCONTAINERS_RYUK_DISABLED: "true"

stages:
  - build
  - docker
  - helm

# Build and test the application
build:
  stage: build
  image: maven:3-eclipse-temurin-25

  cache:
    policy: pull-push
    key: "maven-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/

  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

  script:
    - mvn spotless:check verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -B

  artifacts:
    paths:
      - metacatalog-application/target/*.jar
    expire_in: 1 hour

  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'

# Build and push Docker image
docker:build:
  stage: docker
  image: docker:24

  before_script:
    - until docker info; do sleep 1; done
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

  script:
    # Build the Docker image
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:latest

    # Tag with version on main/master
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ] || [ "$CI_COMMIT_BRANCH" == "master" ]; then
        VERSION=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
        docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:$VERSION
        docker push $CI_REGISTRY_IMAGE:$VERSION
      fi

    # Push images
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest

  rules:
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'

# Package Helm chart
helm:package:
  stage: helm
  image: alpine/helm:3.14.0

  script:
    # Update Chart.yaml with current version
    - |
      VERSION=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
      sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" helm/metacatalog/Chart.yaml

    # Update dependencies
    - helm dependency update helm/metacatalog

    # Lint the chart
    - helm lint helm/metacatalog

    # Package the chart
    - helm package helm/metacatalog --destination ./helm-packages

  artifacts:
    paths:
      - helm-packages/*.tgz
    expire_in: 1 week

  rules:
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
