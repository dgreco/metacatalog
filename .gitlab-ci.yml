variables:
  DOCKER_DRIVER: "overlay2"
  TESTCONTAINERS_RYUK_DISABLED: "true"
  KUBE_NAMESPACE: "applications"

stages:
  - build
  - deploy

# Build, test, analyze, and push Docker image
ci_pipeline:
  stage: build
  image: maven:3-eclipse-temurin-25
  cache:
    policy: pull-push
    key: "ci-cache-v8-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository
      - sonar-scanner/
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
    SONAR_SCANNER_VERSION: "7.1.0.4889"
    DOCKER_HOST: "unix:///var/run/docker.sock"
  before_script:
    - apt-get update && apt-get install -y unzip docker.io
    - docker info
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - |
      if [ ! -d "sonar-scanner/bin" ]; then
        rm -rf sonar-scanner sonar-scanner.zip
        ARCH=$(uname -m)
        if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
          SCANNER_ARCH="linux-aarch64"
        else
          SCANNER_ARCH="linux-x64"
        fi
        curl -sL -o sonar-scanner.zip \
          "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SONAR_SCANNER_VERSION}-${SCANNER_ARCH}.zip"
        unzip -q sonar-scanner.zip
        EXTRACTED_DIR=$(ls -d sonar-scanner* | head -n 1)
        mv "$EXTRACTED_DIR" sonar-scanner
        rm -f sonar-scanner.zip
      fi
  script:
    - mvn clean install spotless:check -B
    - SONAR_PROJECT_KEY="${SONAR_PROJECT_KEY:-$(grep '<sonar.projectKey>' pom.xml | sed 's/.*<sonar.projectKey>\(.*\)<\/sonar.projectKey>.*/\1/')}"
    - ./sonar-scanner/bin/sonar-scanner
        -Dsonar.projectKey="${SONAR_PROJECT_KEY}"
        -Dsonar.host.url="${SONAR_HOST_URL}"
        -Dsonar.token="${SONAR_TOKEN}"
        -Dsonar.sources=.
        -Dsonar.java.binaries=metacatalog-core/target/classes,metacatalog-functions/target/classes,metacatalog-openapi/target/classes,metacatalog-application/target/classes
        -Dsonar.qualitygate.wait=true
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ] || [ "$CI_COMMIT_BRANCH" == "master" ] || [ "$CI_COMMIT_BRANCH" == "develop" ]; then
        echo "Building and pushing Docker images..."
        mvn package -pl metacatalog-application -B -DskipTests
        docker build -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA} metacatalog-application/
        docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
        docker tag ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA} ${CI_REGISTRY_IMAGE}:latest
        docker push ${CI_REGISTRY_IMAGE}:latest
        if [ "$CI_COMMIT_BRANCH" == "main" ] || [ "$CI_COMMIT_BRANCH" == "master" ]; then
          VERSION=$(grep -m2 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/' | sed '1d')
          docker tag ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA} ${CI_REGISTRY_IMAGE}:${VERSION}
          docker push ${CI_REGISTRY_IMAGE}:${VERSION}
        fi
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'

# Deploy to Kubernetes
deploy:
  stage: deploy
  image:
    name: alpine/k8s:1.31.4
    entrypoint: [""]
  variables:
    KUBERNETES_SERVICE_ACCOUNT_OVERWRITE: "gitlab-deployer"
  before_script:
    - |
      if [ -n "$KUBECONFIG_CONTENT" ]; then
        mkdir -p ~/.kube
        echo "$KUBECONFIG_CONTENT" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config
      fi
    - kubectl version --client
    - kustomize version
  script:
    - cd k8s
    - kustomize edit set image gitlab.davidgreco.it:5050/dgreco/metacatalog=gitlab.davidgreco.it:5050/dgreco/metacatalog:${CI_COMMIT_SHORT_SHA}
    - kubectl apply -k .
    - |
      if ! kubectl get cluster metacatalog-db -n ${KUBE_NAMESPACE} >/dev/null 2>&1; then
        echo "Waiting for CNPG cluster to be ready..."
        kubectl wait --for=condition=Ready cluster/metacatalog-db -n ${KUBE_NAMESPACE} --timeout=300s || true
      fi
    - kubectl rollout status deployment/metacatalog -n ${KUBE_NAMESPACE} --timeout=300s
    - kubectl get pods -n ${KUBE_NAMESPACE} -l app.kubernetes.io/name=metacatalog
    - kubectl get svc -n ${KUBE_NAMESPACE} -l app.kubernetes.io/name=metacatalog
    - kubectl get ingress -n ${KUBE_NAMESPACE} -l app.kubernetes.io/name=metacatalog
  environment:
    name: production
    url: http://metacatalog.fairytales.local
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'master'
