# The medallion lakehouse model: one aggregate, three layers, a contract per layer.
#
# Load it, from the repository root, with:
#   curl -u admin:admin -X POST -H 'Content-Type: application/octet-stream' \
#        --data-binary @examples/medallion/medallion-model.yaml http://localhost:8080/metacatalog/v1/bulk-creation
#
# The idea in one breath: a lakehouse is an aggregate whose parts are three layers, and each
# layer's parts are its tables. You describe the *logical* tables (what they contain, where they
# come from, what quality bar they meet); mappings derive the *physical* resources — one zone
# (namespace + storage prefix) per layer and one table per dataset — and provisioning creates them
# in dependency order: bronze zone, then silver, then gold, each table after its zone.

Traits:
  # Anything that can sit in the lineage graph. The relationship below sanctions DEPENDS_ON between
  # any two carriers, which is what lets a silver table depend on a bronze one.
  - name: LakehouseComponent

  # What every table, whatever its layer, has to say about itself.
  - name: Dataset
    inheritsFrom: LakehouseComponent
    schema:
      type: object
      required: [name, columns]
      properties:
        name:
          type: string
        description:
          type: string
        columns:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, type]
            properties:
              name:
                type: string
              type:
                type: string
              pii:
                type: boolean

---
Relationships:

  - sourceTrait: LakehouseComponent
    relationshipType: IS_REQUIRED_BY
    targetTrait: LakehouseComponent

---
EntityTypes:

  # The aggregate root. Provisionable and Authorizable: it can be built, and it carries the one
  # access policy for everything underneath it.
  - name: LakehouseType
    schema:
      type: object
      required: [name, storageRoot]
      properties:
        name:
          type: string
        owner:
          type: string
        storageRoot:
          type: string
    traits:
      - Provisionable
      - Authorizable

  # Three layer types rather than one with a `layer` field: each has its own mapping, and only
  # silver and gold have an upstream layer to reference.
  - name: BronzeLayerType
    schema:
      type: object
      properties:
        name:
          type: string
        retentionDays:
          type: integer
    traits:
      - Aggregate
      - AggregateElement
      - LakehouseComponent

  - name: SilverLayerType
    schema:
      type: object
      properties:
        name:
          type: string
        retentionDays:
          type: integer
    traits:
      - Aggregate
      - AggregateElement
      - LakehouseComponent

  - name: GoldLayerType
    schema:
      type: object
      properties:
        name:
          type: string
        retentionDays:
          type: integer
    traits:
      - Aggregate
      - AggregateElement
      - LakehouseComponent

  # One contract per layer. Bronze says where the data comes from; silver promises it is clean;
  # gold names who it is for.
  #
  # The tables carry Aggregate as well as AggregateElement, which makes them intermediates rather
  # than leaves — the same shape as the base demo's output ports. That is what puts the physical
  # table derived from each one into the aggregate: provisioning collects derived resources from
  # the Aggregate carriers of the tree, and a pure leaf's are not collected.
  - name: BronzeTableType
    schema:
      type: object
      required: [sourceSystem, ingestion]
      properties:
        sourceSystem:
          type: string
        ingestion:
          type: string
          enum: [batch, streaming, cdc]
    traits:
      - Aggregate
      - AggregateElement
      - Dataset

  - name: SilverTableType
    schema:
      type: object
      required: [primaryKey]
      properties:
        primaryKey:
          type: array
          items:
            type: string
        expectations:
          type: array
          items:
            type: string
    traits:
      - Aggregate
      - AggregateElement
      - Dataset

  - name: GoldTableType
    schema:
      type: object
      required: [businessOwner]
      properties:
        businessOwner:
          type: string
        refresh:
          type: string
    traits:
      - Aggregate
      - AggregateElement
      - Dataset

  # The physical side, derived by the mappings below and never written by hand.
  # Every field is a string: mapped values are strings.
  - name: LakeZoneType
    schema:
      type: object
      properties:
        layer:
          type: string
        namespace:
          type: string
        location:
          type: string
        readsFrom:
          type: string
    traits:
      - ProvisionableResource
      - AuthorizableResource

  - name: LakeTableType
    schema:
      type: object
      properties:
        layer:
          type: string
        namespace:
          type: string
        table:
          type: string
        location:
          type: string
    traits:
      - ProvisionableResource
      - AuthorizableResource

---
Mappings:

  # Layer -> zone. The `upstream` reference of silver and gold lands on the zone of the layer they
  # depend on, which is what makes provisioning build bronze before silver before gold — and tear
  # them down the other way round.
  - sourceEntityType: BronzeLayerType
    targetEntityType: LakeZoneType
    mappingValues:
      layer: "'bronze'"
      namespace: "#lake.getValue('$.name').asText() + '_bronze'"
      location: "#lake.getValue('$.storageRoot').asText() + '/bronze'"
    entityPathReferences:
      - alias: "lake"
        referencePath: "HAS_PART{$}"

  - sourceEntityType: SilverLayerType
    targetEntityType: LakeZoneType
    mappingValues:
      layer: "'silver'"
      namespace: "#lake.getValue('$.name').asText() + '_silver'"
      location: "#lake.getValue('$.storageRoot').asText() + '/silver'"
      readsFrom: "#upstream.getValue('$.namespace').asText()"
    entityPathReferences:
      - alias: "lake"
        referencePath: "HAS_PART{$}"
      - alias: "upstream"
        referencePath: "IS_REQUIRED_BY{$}/MAPPED_TO{$}"

  - sourceEntityType: GoldLayerType
    targetEntityType: LakeZoneType
    mappingValues:
      layer: "'gold'"
      namespace: "#lake.getValue('$.name').asText() + '_gold'"
      location: "#lake.getValue('$.storageRoot').asText() + '/gold'"
      readsFrom: "#upstream.getValue('$.namespace').asText()"
    entityPathReferences:
      - alias: "lake"
        referencePath: "HAS_PART{$}"
      - alias: "upstream"
        referencePath: "IS_REQUIRED_BY{$}/MAPPED_TO{$}"

  # Table -> physical table. `zone` walks up to the table's layer and across to the zone derived
  # from it, so every table is created after its zone and dropped before it.
  - sourceEntityType: BronzeTableType
    targetEntityType: LakeTableType
    mappingValues:
      layer: "'bronze'"
      namespace: "#zone.getValue('$.namespace').asText()"
      table: "#source.getValue('$.name').asText()"
      location: "#zone.getValue('$.location').asText() + '/' + #source.getValue('$.name').asText()"
    entityPathReferences:
      - alias: "zone"
        referencePath: "HAS_PART{$}/MAPPED_TO{$}"

  - sourceEntityType: SilverTableType
    targetEntityType: LakeTableType
    mappingValues:
      layer: "'silver'"
      namespace: "#zone.getValue('$.namespace').asText()"
      table: "#source.getValue('$.name').asText()"
      location: "#zone.getValue('$.location').asText() + '/' + #source.getValue('$.name').asText()"
    entityPathReferences:
      - alias: "zone"
        referencePath: "HAS_PART{$}/MAPPED_TO{$}"

  - sourceEntityType: GoldTableType
    targetEntityType: LakeTableType
    mappingValues:
      layer: "'gold'"
      namespace: "#zone.getValue('$.namespace').asText()"
      table: "#source.getValue('$.name').asText()"
      location: "#zone.getValue('$.location').asText() + '/' + #source.getValue('$.name').asText()"
    entityPathReferences:
      - alias: "zone"
        referencePath: "HAS_PART{$}/MAPPED_TO{$}"
